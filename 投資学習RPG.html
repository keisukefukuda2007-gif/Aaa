<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>投資学習RPG</title>
<meta name="description" content="港町でコーヒー焙煎所を育てながら、会社・会計・投資の基礎を学ぶドット絵RPG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* 配置: ゲーム画面は最大1080pxの1列。900px以上のプレイ画面は「場面＋帳簿｜会話＋問題」の2列 */
:root{
  --night:#18202f;   /* 外枠：夜の港 */
  --deep:#222d40;    /* 暗い面 */
  --line:#3a4760;    /* 暗い面の区切り */
  --paper:#f6f0e2;   /* ウィンドウの紙 */
  --paper-2:#e9dfc6; /* 紙の影・罫線 */
  --ink:#1c2030;     /* 紙の上の文字 */
  --ink-2:#56607a;   /* 補助の文字 */
  --teal:#2f6f73;    /* 操作の色（港の青緑） */
  --teal-2:#6fb39f;
  --crema:#c99a5b;   /* 焙煎の色 */
  --gold:#f2c14e;
  --up:#3f9a58;      /* 増加：若竹 */
  --dn:#e0583a;      /* 減少：朱 */
  --sky:#a9cfe4;
  --navy:#33405c;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{color:var(--paper);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:none;}
#app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:8px 40px;min-height:100%}
button,input,textarea{font-family:inherit;font-size:16px}
b{font-weight:normal;color:inherit;background:linear-gradient(transparent 62%,rgba(201,154,91,.45) 62%)}
.tiny{font-size:13px;line-height:1.6;color:var(--ink-2);margin:.25em 0}
.screen > .tiny,.note{color:#b9c2d3}
.note{font-size:14px;margin:.5em 0 1em}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img.pix{image-rendering:pixelated;display:block}
img.pix.dim{filter:brightness(0) opacity(.25)}

/* 紙のウィンドウ（角を1段削ったドット枠） */
.win{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--paper-2);
  clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);padding:14px 16px}
.win .tiny{color:var(--ink-2)}

/* ボタン */
.btn{appearance:none;border:3px solid var(--ink);background:var(--teal);color:var(--paper);padding:9px 16px;line-height:1.3;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);margin-bottom:4px;clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% 100%,0 100%,0 3px);transition:transform .05s}
.btn:hover:not(:disabled){background:#357d82}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:18px;padding:11px 22px}
.btn-2{background:var(--paper);color:var(--ink)}
.btn-2:hover:not(:disabled){background:#fff9ec}
.btn small{display:block;font-size:12px;opacity:.8}
.btn-ghost{appearance:none;background:none;border:2px solid currentColor;color:inherit;padding:4px 10px;cursor:pointer;font-size:14px}
.btn-ghost:disabled{opacity:.4}
.danger-b{background:var(--dn)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}

/* ヘッダー */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 10px}
.top-t{margin:0;font-size:18px;font-weight:normal;text-align:center;flex:1;min-width:0;line-height:1.35}
.top-t .tiny{display:block;color:#b9c2d3}
.hub-top .co{font-size:22px;line-height:1.2}
.hub-top .tiny{color:#b9c2d3}

/* 場面キャンバス */
.scene-wrap{position:relative;background:var(--ink);border:3px solid var(--ink);display:flex;justify-content:center;overflow:hidden}
.scene{image-rendering:pixelated;display:block;width:100%;max-width:768px;height:auto}
.combo{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);border:3px solid var(--ink);padding:2px 10px;font-size:15px;white-space:nowrap}
.combo.pop{animation:pop .45s steps(4)}
@keyframes pop{0%{transform:translate(-50%,-6px) scale(1.3)}100%{transform:translate(-50%,0) scale(1)}}

/* タイトル */
.title-s{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.logo{font-size:44px;line-height:1.1;margin:.2em 0 .1em;font-weight:normal;letter-spacing:.06em;color:var(--paper);text-shadow:3px 3px 0 var(--teal),6px 6px 0 var(--ink)}
.lede{max-width:34em;color:#d7dce6;margin:.5em 0}
.save-sum{margin-top:12px;max-width:420px}
.howto{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px;max-width:34em}
.howto li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;color:#d7dce6;font-size:15px;line-height:1.6}
.howto i{font-style:normal;background:var(--teal);color:var(--paper);padding:0 6px;font-size:13px;margin-top:2px}
.ng-form{display:grid;gap:6px;margin-top:16px;max-width:420px}
.ng-form label{font-size:14px;color:var(--ink-2)}
.ng-form input,.row2 input,textarea{border:3px solid var(--ink);background:#fffdf6;color:var(--ink);padding:8px 10px;width:100%}
.ng-form .btn{margin-top:10px}
.warn{color:var(--dn);font-size:14px;margin:0}

/* 拠点 */
.hub-s{display:flex;flex-direction:column;gap:14px}
.hub-cards{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){.hub-cards{grid-template-columns:1.3fr 1fr}}
.card-t{font-size:20px;line-height:1.4;margin:.15em 0 .3em}
.big-n{font-size:28px;line-height:1;background:none;color:var(--teal)}
.card .btn{margin-top:8px}
.hub-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hub-nav .btn{padding:10px 6px}
.rare-banner{display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;font-size:15px;background:#fff6d8;animation:blink 1.6s steps(2) infinite}
.rare-banner b{background:none;color:var(--dn)}
@keyframes blink{50%{box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 4px var(--gold)}}

/* 地図・章 */
.map-wrap{padding:8px}
.map{width:100%;image-rendering:pixelated;display:block;aspect-ratio:256/160;height:auto}
.regions,.lessons,.skills,.myths,.tcards{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.reg,.les{width:100%;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;text-align:left;cursor:pointer;align-items:center}
.reg:disabled,.les:disabled{cursor:not-allowed;background:#d9d2c0;color:#6c6f7a}
.reg-no,.les-n{grid-row:span 2;font-size:14px;background:var(--ink);color:var(--paper);padding:4px 8px;min-width:3.2em;text-align:center}
.reg-n,.les-t{font-size:18px;line-height:1.35}
.reg-t{grid-column:2;font-size:14px;color:var(--ink-2)}
.reg-s,.les-s{grid-column:2;font-size:13px;color:var(--teal)}
.locked .reg-s,.locked .les-s{color:#6c6f7a}
.les.done .les-n{background:var(--up)}
.les.boss .les-n{background:var(--dn)}
.les.exam .les-n{background:var(--gold);color:var(--ink)}
.exam-sk{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;font-size:15px}
.exam-sk .ok-m{color:var(--up)}.exam-sk .ng-m{color:var(--dn)}
.exam-score{font-size:20px}
.ch-intro p{margin:.3em 0}

/* 課題ボード */
.board-sec{margin-bottom:14px}
.board-sec h3{margin:0 0 6px;font-weight:normal;font-size:18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
.board-sec h3 small{font-size:13px;color:var(--ink-2)}
.sk{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed var(--paper-2)}
.sk-i{display:flex;justify-content:center}
.sk-n{display:block;line-height:1.45}
.sk-r{display:block;font-size:12px;color:var(--ink-2)}
.sk-lv{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:12px;border:2px solid var(--ink);background:var(--paper)}
.pips i.on{background:var(--teal)}
.lv3 .pips i.on{background:var(--gold)}
.sk-lab{font-size:12px;color:var(--ink-2);white-space:nowrap}

/* 図鑑 */
.tabs{display:flex;gap:6px;margin-bottom:-3px;position:relative;z-index:1;flex-wrap:wrap}
.tab{appearance:none;border:3px solid var(--ink);background:var(--deep);color:var(--paper);padding:6px 12px;cursor:pointer}
.tab.on{background:var(--paper);color:var(--ink);border-bottom-color:var(--paper)}
.terms{margin:8px 0 0;display:grid;gap:8px}
.term{border-top:2px dashed var(--paper-2);padding-top:8px}
.term dt{font-size:17px}
.term dt small{font-size:12px;color:var(--ink-2);margin-left:8px}
.term dd{margin:0;font-size:15px}
.tcards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tc{border:3px solid var(--ink);padding:8px 10px;background:#fffdf6}
.tc.locked{background:#ded6c3;color:#6c6f7a;border-style:dashed}
.tc.rare{background:#fff4cc}
.tc.rare.locked{background:#e5dbbf}
.tc-n{font-size:16px}
.tc-d{font-size:12px;color:var(--ink-2)}
.tc-r{list-style:none;padding:0;margin:6px 0 0;font-size:14px}
.tc-r li{display:flex;justify-content:space-between;border-top:1px solid var(--paper-2)}
.tc-r b,.save-sum b,.reg b{background:none}
.sub-h{font-weight:normal;font-size:18px;margin:20px 0 0}
.myth{padding:10px 14px}
.myth-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.myth-s{font-size:13px;padding:0 6px;background:var(--dn);color:var(--paper)}
.myth.over .myth-s{background:var(--up)}
.myth p{margin:.3em 0}
.c-up{color:var(--up);background:none}
.c-dn{color:var(--dn);background:none}

/* セーブ・設定 */
.set-sec{margin-bottom:14px}
.set-sec h3{margin:0 0 6px;font-weight:normal;font-size:18px}
textarea{font-size:12px;line-height:1.4;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace}
.file-l{display:inline-block}
.chk{display:flex;gap:8px;align-items:center}
.chk input{width:20px;height:20px;accent-color:var(--teal)}
.row2{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:10px 0}
.ok-t{color:var(--up)}
.ng-t{color:var(--dn)}
.errs{max-height:200px;overflow:auto;padding-left:1.2em}

/* プレイ画面 */
.play-top{padding-bottom:6px}
.hp{display:flex;align-items:center;gap:3px;color:#b9c2d3}
.hp .tiny{color:#b9c2d3;margin-right:4px}
.hp i{width:14px;height:14px;background:var(--line);border:2px solid var(--ink);clip-path:polygon(0 25%,25% 0,50% 20%,75% 0,100% 25%,100% 55%,50% 100%,0 55%)}
.hp i.on{background:var(--dn)}
.prog{height:8px;background:var(--deep);border:2px solid var(--ink);margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s steps(6)}
.play-grid{display:grid;grid-template-columns:1fr;gap:12px}
.col-a,.col-b{display:flex;flex-direction:column;gap:12px;min-width:0}
/* スマホ：場面 → 会話 → 帳簿 → 問題 の順に縦に並べる */
@media (max-width:899px){
  .play-grid{display:flex;flex-direction:column}
  .col-a,.col-b{display:contents}
  .play-grid .scene-wrap{order:1}.play-grid .msg{order:2}.play-grid .ledger{order:3}.play-grid .work{order:4}
}
@media (min-width:900px){
  .play-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}
  .col-a{position:sticky;top:8px}
}
.msg{display:flex;gap:12px;align-items:flex-start;min-height:104px;position:relative;cursor:pointer;padding-right:28px}
.msg.narr{background:#efe7d3}
.msg-face{flex:0 0 auto;background:var(--sky);border:2px solid var(--ink);padding:3px 6px}
.msg-face[hidden]{display:none}
.msg-body{min-width:0;flex:1}
.msg-name{font-size:14px;color:var(--teal);min-height:1em}
.msg-text{font-size:16px;line-height:1.75}
.msg-next{position:absolute;right:10px;bottom:6px;animation:nudge .8s steps(2) infinite;color:var(--teal)}
@keyframes nudge{50%{transform:translateY(3px)}}
.work{display:flex;flex-direction:column;gap:12px}
.qcard{padding:14px 14px 10px}
.qcard.retry{background:#fff4dd}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.q-kind{background:var(--ink);color:var(--paper);padding:0 8px;font-size:14px}
.q-tag{font-size:12px;color:var(--ink-2)}
.q-head .b-hint{margin-left:auto;color:var(--teal)}
.q-text{font-size:17px;line-height:1.75;margin-bottom:10px}
.q-act{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:12px}
.q-act .btn{padding:11px 8px}

/* 選択肢 */
.opts{display:grid;gap:8px}
.opt{appearance:none;display:flex;gap:10px;align-items:flex-start;text-align:left;border:3px solid var(--ink);background:#fffdf6;color:var(--ink);padding:9px 12px;cursor:pointer;line-height:1.55}
.opt:hover{background:#fff5df}
.opt-key{flex:0 0 auto;background:var(--paper-2);padding:0 6px;font-size:13px;margin-top:2px}
.opt.sel{background:#dcefe9;box-shadow:inset 0 0 0 2px var(--teal)}
.opt.right{background:#dcf0dc;box-shadow:inset 0 0 0 3px var(--up)}
.opt.wrong{background:#fbe0d8;box-shadow:inset 0 0 0 3px var(--dn)}

/* 数値・テンキー */
.numrow{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;border:3px solid var(--ink);background:#fffdf6;padding:6px 12px;margin-bottom:10px}
.numdisp{font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums;min-width:3em;text-align:right}
.numdisp.empty{color:#b8b2a2}
.numdisp.right{color:var(--up)}
.numdisp.wrong{color:var(--dn);text-decoration:line-through}
.unit{font-size:16px;color:var(--ink-2)}
.tenkey{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:360px;margin-left:auto}
.tk{appearance:none;border:3px solid var(--ink);background:#fffdf6;color:var(--ink);font-size:20px;padding:8px 0;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tk:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.tk:disabled{opacity:.4}
.tk-op{background:var(--paper-2)}
.tk-wide{grid-column:span 2}

/* 予想スライダー */
.est-row{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center}
.est-range{width:100%;accent-color:var(--teal);height:32px}
.est-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);padding:0 58px}
.est-reveal{position:relative;height:28px;margin:8px 58px 0;border-top:3px solid var(--ink)}
.mk{position:absolute;top:-3px;width:4px;height:22px;transform:translateX(-2px)}
.mk-you{background:var(--teal)}
.mk-ans{background:var(--dn);height:28px}
.est-legend{display:flex;gap:16px;justify-content:center;font-size:13px}
.lg-you::before,.lg-ans::before{content:"";display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.lg-you::before{background:var(--teal)}
.lg-ans::before{background:var(--dn)}

/* 並べ替え */
.ord-seq{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:6px}
.ord-slot{display:flex;gap:10px;align-items:center;border:3px dashed #b8b2a2;padding:6px 10px;min-height:44px}
.ord-slot.filled{border-style:solid;border-color:var(--ink);background:#fffdf6;cursor:pointer}
.ord-slot.right{background:#dcf0dc;border-color:var(--up)}
.ord-slot.wrong{background:#fbe0d8;border-color:var(--dn)}
.ord-n{background:var(--ink);color:var(--paper);padding:0 7px;font-size:14px}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:3px solid var(--ink);background:var(--paper-2);color:var(--ink);padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 var(--ink);text-align:left;line-height:1.45}

/* 振り分け */
.sort{display:grid;gap:8px}
.sort-row{border:3px solid var(--ink);background:#fffdf6;padding:8px 10px;display:grid;gap:6px}
.sort-row.right{box-shadow:inset 0 0 0 2px var(--up)}
.sort-row.wrong{box-shadow:inset 0 0 0 2px var(--dn);background:#fdf0ea}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-b{appearance:none;flex:1 1 0;min-width:4.5em;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:5px 6px;cursor:pointer;font-size:15px}
.seg-b.sel{background:var(--teal);color:var(--paper)}
.seg-b.ans{outline:3px solid var(--up);outline-offset:-1px}

/* 穴埋め表 */
.fbs{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--ink);background:#fffdf6}
.fcol{padding:6px 8px;min-width:0}
.fcol+.fcol{border-left:3px solid var(--ink)}
.fcap{font-size:13px;color:var(--ink-2);border-bottom:2px solid var(--ink);margin-bottom:4px}
.flist{border:3px solid var(--ink);background:#fffdf6;padding:6px 10px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--paper-2);flex-wrap:wrap}
.ftotal{border-top:2px solid var(--ink);border-bottom:0}
.fhead{color:var(--ink-2);font-size:13px}
.fl{min-width:0}
.fv{font-variant-numeric:tabular-nums}
.fblank{appearance:none;border:3px solid var(--ink);background:var(--paper-2);color:var(--ink);min-width:4.2em;padding:2px 8px;text-align:right;cursor:pointer;font-variant-numeric:tabular-nums}
.fblank.empty{color:var(--ink-2)}
.fblank.cur{background:#fff3c4;box-shadow:inset 0 0 0 2px var(--gold)}
.fblank.right{background:#dcf0dc}
.fblank.wrong{background:#fbe0d8;text-decoration:line-through}
.fcorr{color:var(--up);font-variant-numeric:tabular-nums}
.fill-body + .tenkey{margin-top:10px}

/* 判断 */
.jg + .jg{margin-top:12px}
.jg-h{font-size:14px;color:var(--paper);background:var(--teal);display:inline-block;padding:0 8px;margin-bottom:6px}

/* 増減予想 */
.arrows{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:minmax(5em,1fr) 2.6fr;gap:8px;align-items:center;border:3px solid var(--ink);background:#fffdf6;padding:6px 8px}
.arow.right{box-shadow:inset 0 0 0 2px var(--up)}
.arow.wrong{box-shadow:inset 0 0 0 2px var(--dn);background:#fdf0ea}
.arow-t{font-size:16px;line-height:1.3}
.arow-b{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.arw{appearance:none;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.arw-s{font-size:16px}
.arw-l{font-size:11px}
.arw1.sel{background:var(--up);color:var(--paper)}
.arw-1.sel{background:var(--dn);color:var(--paper)}
.arw0.sel{background:var(--navy);color:var(--paper)}
.arw.ans{outline:3px solid var(--gold);outline-offset:-1px}

/* 解説 */
.fb.ok{border-color:var(--up)}
.fb.ng{border-color:var(--dn)}
.fb-h{font-size:24px;line-height:1.2;margin-bottom:6px}
.fb.ok .fb-h{color:var(--up)}
.fb.ng .fb-h{color:var(--dn)}
.fb-trap{background:#fbe9e2;border-left:6px solid var(--dn);padding:6px 10px;margin:6px 0}
.fb-trap p{margin:.2em 0}

    return {
      v: Game.VERSION, createdAt: Date.now(), updatedAt: 0,
      player: {name: '', company: ''},
      q: {},        // 問題ごとの記録（間隔反復）
      skills: {},   // 課題ごとの到達度
      lessons: {},  // レッスン・ボスの完了
      stage: 0,     // 建物の成長段階
      zukan: {terms: {}, cards: {}, myths: {}, rare: {}},
      rare: {day: -1, id: null, done: false},
      stats: {answers: 0, bestCombo: 0, days: {}},
      settings: {sound: true},
    };
  },
  migrate(s){
    if (!s || typeof s !== 'object') throw new Error('セーブデータの形式が違います');
    if (typeof s.v !== 'number') throw new Error('バージョン番号がありません');
    if (s.v > Game.VERSION) throw new Error('このゲームより新しい形式のセーブデータです');
    const base = Store.fresh();
    // 将来の形式変更はここに追加: if (s.v < 2) { …; s.v = 2; }
    for (const k of Object.keys(base)) if (s[k] === undefined) s[k] = base[k];
    for (const k of Object.keys(base.zukan)) if (!s.zukan[k]) s.zukan[k] = {};
    if (!s.stats.days) s.stats.days = {};
    s.v = Game.VERSION;
    return s;
  },
  load(){
    let raw = null;
    try { raw = localStorage.getItem(SAVE_KEY); } catch (e) {}
    if (raw) { try { Game.state = Store.migrate(JSON.parse(raw)); return true; } catch (e) { console.warn('セーブ読込失敗', e); } }
    Game.state = Store.fresh();
    return false;
  },
  save(){
    const s = Game.state; s.updatedAt = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {}
    Sync.push();
  },
  exportJSON(){ return JSON.stringify(Game.state, null, 1); },
  importJSON(text){
    let obj;
    try { obj = JSON.parse(text); } catch (e) { throw new Error('JSONとして読めません。全文をそのまま貼り付けてください'); }
    if (!obj.q || !obj.player) throw new Error('投資学習RPGのセーブデータではありません');
    const s = Store.migrate(obj);
    Game.state = s;
    Store.save();
    return s;
  },
  reset(){ Game.state = Store.fresh(); Store.save(); },
};

/* ---------------- アカウント同期（claude.ai の db 能力） ---------------- */
const Sync = Game.Sync = {
  status: 'off',  // off | connecting | on | readonly | error
  lastAt: null, ref: null, busy: false, pending: false,
  async init(){
    if (!window.claude || typeof window.claude.use !== 'function') { this.status = 'off'; return; }
    this.status = 'connecting'; Game.emit('sync');
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) { this.status = 'off'; Game.emit('sync'); return; }
      const uid = await user.id();
      if (!uid) { this.status = 'off'; Game.emit('sync'); return; }
      this.ref = db.doc('data/users/' + uid + '/save');
      const snap = await this.ref.get();
      const remote = snap.exists ? snap.data() : null;
      const local = Game.state;
      if (remote && typeof remote.json === 'string' && (remote.updatedAt || 0) > (local.updatedAt || 0)) {
        try {
          Game.state = Store.migrate(JSON.parse(remote.json));
          try { localStorage.setItem(SAVE_KEY, remote.json); } catch (e) {}
          this.lastAt = remote.updatedAt; this.status = 'on';
          Game.emit('sync'); Game.emit('remote-loaded');
          return;
        } catch (e) { console.warn('同期データの読込失敗', e); }
      }
      this.status = 'on'; Game.emit('sync');
      if (local.updatedAt && (!remote || (remote.updatedAt || 0) < local.updatedAt)) this.push(true);
      else if (remote) this.lastAt = remote.updatedAt;
    } catch (e) {
      console.warn('同期の初期化失敗', e); this.status = 'error'; Game.emit('sync');
    }
  },
  push(now){
    if (!this.ref || this.status === 'readonly') return;
    if (now) return this._write();
    this._deb = this._deb || U.debounce(() => this._write(), 1500);
    this._deb();
  },
  async _write(){
    if (!this.ref) return;
    if (this.busy) { this.pending = true; return; }
    this.busy = true;
    const s = Game.state;
    try {
      await this.ref.set({v: s.v, updatedAt: s.updatedAt, json: JSON.stringify(s)});
      this.lastAt = s.updatedAt; this.status = 'on';
    } catch (e) {
      const code = e && e.code;
      if (code === 'invalid_argument' || code === 'revoked' || code === 'not_granted') this.status = 'readonly';
      else this.status = 'error';
      console.warn('同期の書き込み失敗', e);
    }
    this.busy = false; Game.emit('sync');
    if (this.pending) { this.pending = false; this._write(); }
  },
  label(){
    return {off: 'ブラウザ保存のみ（ログインして開くと同期されます）', connecting: 'アカウントに接続中…', on: 'アカウントに同期済み', readonly: 'この表示では同期できません（ブラウザ保存のみ）', error: '同期に失敗しました（ブラウザには保存済み）'}[this.status];
  },
};

/* ---------------- 間隔反復 ---------------- */
const SRS = Game.SRS = {
  INTERVAL: [1, 3, 7, 14, 30],  // box 0..4 → 次回までの日数（確信して正解したとき box が1つ上がる）
  rec(id){ const q = Game.state.q; return q[id] || (q[id] = {box: 0, due: null, last: null, n: 0, ok: 0, ng: 0, belief: false, doubt: false}); },
  isFresh(id){ const r = Game.state.q[id]; return !r || r.last == null || r.last < U.today(); },
  // 解答を記録。fresh=その日初めて解いたか
  record(id, {ok, conf, hint, fresh}){
    const r = SRS.rec(id), t = U.today();
    r.n++;
    if (!fresh) {                              // 同じ日の再挑戦は練習扱い
      if (!ok) { r.box = 0; r.due = t + 1; r.ng++; }
      r.last = t; return r;
    }
    r.last = t;
    if (!ok) { r.ng++; r.box = 0; r.due = t + 1; r.belief = !!conf; r.doubt = false; r.lastWrong = t; }
    else if (hint || !conf) { r.ok++; r.box = Math.min(r.box, 1); r.due = t + 1; r.doubt = true; }
    else { r.ok++; r.box = Math.min(r.box + 1, 4); r.due = t + SRS.INTERVAL[r.box]; r.belief = false; r.doubt = false; }
    return r;
  },
  priority(r){ return r.belief ? 3 : (r.box === 0 ? 2 : (r.doubt ? 1 : 0)); },
  due(limit = 12){
    const t = U.today(), out = [];
    for (const [id, r] of Object.entries(Game.state.q)) {
      const q = Game.Q[id];
      if (!q || q.srs === false || r.due == null || r.due > t) continue;
      out.push({id, r, p: SRS.priority(r)});
    }
    out.sort((a, b) => b.p - a.p || a.r.due - b.r.due);
    return out.slice(0, limit);
  },
  dueCount(){ return SRS.due(999).length; },
};

/* ---------------- 課題の到達度 ---------------- */
// 0:未達 1:ヒントありで解けた 2:自力で解けた 3:定着（別の日にもう一度自力で解けた）
const Mastery = Game.Mastery = {
  LABEL: ['未挑戦', 'ヒントありで解けた', '自力で解けた', '定着'],
  rec(id){ const s = Game.state.skills; return s[id] || (s[id] = {tried: false, level: 0, self: [], selfDay: null, fixDay: null}); },
  need(id){ const n = Object.values(Game.Q).filter(q => q.skill === id && !q.rare && q.srs !== false).length; return Math.max(1, Math.min(2, n)); },
  onAnswer(q, {ok, hint, fresh}){
    const ev = [];
    if (!q.skill || !Game.skills[q.skill]) return ev;
    const r = Mastery.rec(q.skill), t = U.today();
    r.tried = true;
    if (!ok || !fresh) return ev;
    if (hint) { if (r.level < 1) r.level = 1; return ev; }
    if (!r.self.includes(q.id)) r.self.push(q.id);
    if (r.level < 2 && r.self.length >= Mastery.need(q.skill)) {
      r.level = 2; r.selfDay = t; ev.push({type: 'self', skill: q.skill});
    } else if (r.level === 2 && r.selfDay != null && t > r.selfDay) {
      r.level = 3; r.fixDay = t; ev.push({type: 'fixed', skill: q.skill});
    }
    return ev;
  },
  label(id){ const r = Game.state.skills[id]; if (!r || !r.tried) return '未挑戦'; return r.level === 0 ? '未達' : Mastery.LABEL[r.level]; },
  level(id){ return Game.state.skills[id]?.level || 0; },
};

class Ledger {
  // open: 期首残高 {現金:500, 借入金:300, 資本金:200}（資産＝負債＋純資産であること）
  constructor(open = {}){
    this.bal = {}; this.open = Object.assign({}, open);
    for (const [a, v] of Object.entries(open)) this.bal[a] = v;
    this.cf = {op: 0, inv: 0, fin: 0}; this.journal = [];
  }
  static sign(a){ const d = Acct.defs[a]; if (!d) throw new Error('未登録の勘定科目: ' + a); return (d.type === 'asset' || d.type === 'exp') ? 1 : -1; }
  post(entry){
    const es = Array.isArray(entry) ? entry : [entry];
    for (const e of es) {
      let dr = 0, cr = 0;
      for (const l of e.lines) { dr += l.dr || 0; cr += l.cr || 0; }
      if (Math.abs(dr - cr) > 1e-9) throw new Error('貸借が一致しない仕訳: ' + e.desc);
      for (const l of e.lines) {
        const s = Ledger.sign(l.a);
        this.bal[l.a] = (this.bal[l.a] || 0) + s * ((l.dr || 0) - (l.cr || 0));
        if (Acct.defs[l.a].cash) this.cf[l.cf || 'op'] += (l.dr || 0) - (l.cr || 0);
      }
      this.journal.push(e);
    }
    return this;
  }
  b(a){ return this.bal[a] || 0; }
  pl(){
    const by = k => Acct.order.filter(a => Acct.defs[a].pl === k && this.b(a) !== 0).map(a => [a, this.b(a)]);
    const sum = arr => arr.reduce((s, x) => s + x[1], 0);
    const sales = sum(by('sales')), cogs = sum(by('cogs'));
    const gross = sales - cogs, sga = by('sga'), op = gross - sum(sga);
    const ni_ = by('nonopInc'), ne = by('nonopExp'), ord = op + sum(ni_) - sum(ne);
    const xi = by('extraInc'), xl = by('extraLoss'), pre = ord + sum(xi) - sum(xl), tax = sum(by('tax')), ni = pre - tax;
    return {sales, cogs, gross, sga, sgaTotal: sum(sga), op, nonopInc: ni_, nonopExp: ne, ord, extraInc: xi, extraLoss: xl, pre, tax, ni};
  }
  bs(){
    const pick = t => Acct.order.filter(a => Acct.defs[a].type === t && (this.b(a) !== 0 || a === '現金')).map(a => [a, this.b(a)]);
    const assets = pick('asset'), liab = pick('liab').filter(x => x[1] !== 0);
    const ni = this.pl().ni;
    const eq = Acct.order.filter(a => Acct.defs[a].type === 'equity').map(a => [a, this.b(a) + (a === '利益剰余金' ? ni : 0)]).filter(x => x[1] !== 0 || x[0] === '資本金');
    const sum = arr => arr.reduce((s, x) => s + x[1], 0);
    return {assets, liab, eq, ta: sum(assets), tl: sum(liab), te: sum(eq)};
  }
  cfs(){
    const openCash = this.open['現金'] || 0, {op, inv, fin} = this.cf;
    return {op, inv, fin, change: op + inv + fin, openCash, endCash: openCash + op + inv + fin};
  }
  // 矢印問題などで使う指標の一覧
  metrics(){
    const p = this.pl(), b = this.bs(), c = this.cfs(), m = {};
    for (const a of Acct.order) m[a] = this.b(a);
    m['利益剰余金'] = this.b('利益剰余金') + p.ni;
    Object.assign(m, {
      '総資産': b.ta, '負債合計': b.tl, '純資産': b.te, '純資産合計': b.te, '負債': b.tl,
      '自己資本比率': b.ta ? b.te / b.ta * 100 : 0,
      '販管費': p.sgaTotal, '売上総利益': p.gross, '営業利益': p.op, '経常利益': p.ord, '税引前当期純利益': p.pre, '当期純利益': p.ni,
      '営業CF': c.op, '投資CF': c.inv, '財務CF': c.fin, '現金の増減': c.change, '期末現金': c.endCash,
    });
    return m;
  }
  check(){
    const b = this.bs(), c = this.cfs(), errs = [];
    if (Math.abs(b.ta - b.tl - b.te) > 1e-6) errs.push(`BSの左右が不一致 資産${b.ta} ≠ 負債${b.tl}+純資産${b.te}`);
    if (Math.abs(c.endCash - this.b('現金')) > 1e-6) errs.push(`CFの期末現金${c.endCash} ≠ BSの現金${this.b('現金')}`);
    return errs;
  }
  clone(){ const l = new Ledger(this.open); l.bal = Object.assign({}, this.bal); l.cf = Object.assign({}, this.cf); l.journal = this.journal.slice(); return l; }
  // 取引の前後で指標がどう動くか: {名前: 変化量}
  static effect(open, txns, rows){
    const L0 = new Ledger(open), L1 = new Ledger(open).post(txns);
    const m0 = L0.metrics(), m1 = L1.metrics(), out = {};
    for (const r of rows) {
      if (!(r in m0)) throw new Error('未知の項目: ' + r);
      out[r] = m1[r] - m0[r];
    }
    return {delta: out, before: m0, after: m1, ledger: L1};
  }
}
Game.Ledger = Ledger;

/* ---------------- 登録API ---------------- */
Game.questionType = (name, impl) => { Game.qtypes[name] = impl; };

Game.scene = (id, fn) => { Game.scenes[id] = fn; };
Game.cast = (id, def) => { Game.castDefs[id] = def; };
Game.building = (stage, def) => { Game.buildings[stage] = def; };
Game.item = (id, def) => { Game.items[id] = Object.assign({id}, def); };

Game.chapter = def => {
  if (Game.chapters.some(c => c.id === def.id)) { console.warn('章が重複登録されています', def.id); return; }
  def.lessons = def.lessons || [];
  Game.chapters.push(def);
  Game.chapters.sort((a, b) => a.no - b.no);
  for (const [id, q] of Object.entries(def.questions || {})) { q.id = id; q.chapter = def.id; Game.Q[id] = q; }
  for (const s of def.skills || []) { s.chapter = def.id; Game.skills[s.id] = s; }
  def.lessons.forEach((l, i) => { l.chapter = def.id; l.index = i; l.kind = 'lesson'; Game.lessons[l.id] = l; });
  if (def.boss) { def.boss.chapter = def.id; def.boss.kind = 'boss'; Game.lessons[def.boss.id] = def.boss; }
  if (def.exam) { def.exam.chapter = def.id; def.exam.kind = 'exam'; Game.lessons[def.exam.id] = def.exam; }
  for (const t of def.glossary || []) { t.chapter = def.id; Game.terms[t.id] = t; }
  for (const m of def.myths || []) { m.chapter = def.id; Game.myths[m.id] = m; }
  for (const c of def.cards || []) { c.chapter = def.id; Game.cards[c.id] = c; }
  for (const r of def.rare || []) { r.chapter = def.id; Game.rares[r.id] = r; const q = Game.Q[r.q]; if (q) q.rare = true; }
};

// 章の解放状況
Game.chapterOpen = ch => {
  const i = Game.chapters.indexOf(ch);
  if (i <= 0) return true;
  const prev = Game.chapters[i - 1];
  return !prev.boss || !!Game.state.lessons[prev.boss.id]?.done;
};
Game.lessonOpen = l => {
  const ch = Game.chapters.find(c => c.id === l.chapter);
  if (!Game.chapterOpen(ch)) return false;
  if (l.kind === 'boss') return ch.lessons.every(x => Game.state.lessons[x.id]?.done);
  if (l.kind === 'exam') return ch.boss ? !!Game.state.lessons[ch.boss.id]?.done : ch.lessons.every(x => Game.state.lessons[x.id]?.done);
  const prev = ch.lessons[l.index - 1];
  return !prev || !!Game.state.lessons[prev.id]?.done;
};
Game.nextLesson = () => {
  for (const ch of Game.chapters) {
    if (!Game.chapterOpen(ch)) return null;
    for (const l of ch.lessons) if (!Game.state.lessons[l.id]?.done) return l;
    if (ch.boss && !Game.state.lessons[ch.boss.id]?.done) return ch.boss;
    if (ch.exam && !Game.state.lessons[ch.exam.id]?.done) return ch.exam;
  }
  return null;
};

/* ---------------- 問題の生成 ---------------- */
// 問題定義 q と乱数シードから、表示・採点に使うモデルを作る
Game.makeQuestion = (id, seed) => {
  const q = Game.Q[id];
  if (!q) throw new Error('未登録の問題: ' + id);
  const impl = Game.qtypes[q.type];
  if (!impl) throw new Error('未登録の問題形式: ' + q.type);
  const r = U.rng(seed);
  const p = q.gen ? q.gen(r) : {};
  const m = impl.prepare(q, p, r);
  m.q = q; m.p = p; m.seed = seed;
  m.text = U.val(q.text, p, m);
  m.hint = q.hint ? U.val(q.hint, p, m) : null;
  m.explain = q.explain ? U.val(q.explain, p, m) : '';
  m.lead = q.lead ? U.val(q.lead, p, m) : null;
  return m;
};

/* ---------------- 自己検査 ---------------- */
Game.selfTest = (N = 60) => {
  const errs = [], t0 = performance.now();
  let count = 0;
  const numbersIn = s => (U.plain(s).match(/-?[\d,]+(\.\d+)?/g) || []).map(x => Number(x.replace(/,/g, '')));
  for (const [id, q] of Object.entries(Game.Q)) {
    const impl = Game.qtypes[q.type];
    if (!impl) { errs.push(`${id}: 形式「${q.type}」が未登録`); continue; }
    if (q.skill && !Game.skills[q.skill]) errs.push(`${id}: 課題「${q.skill}」が未登録`);
    for (let i = 1; i <= N; i++) {
      try {
        const m = Game.makeQuestion(id, i * 7919);
        count++;
        if (!m.text) errs.push(`${id}: 問題文が空`);
        const e2 = impl.validate ? impl.validate(m) : [];
        e2.forEach(e => errs.push(`${id}#${i}: ${e}`));
        // 問題文に出す数値（p.show）が本文に含まれているか
        if (q.show) {
          const nums = numbersIn(m.text + ' ' + (m.lead || ''));
          for (const k of q.show) {
            const v = m.p[k];
            if (typeof v === 'number' && !nums.some(n => Math.abs(n - v) < 1e-9)) errs.push(`${id}#${i}: 問題文に数値 ${k}=${v} が見当たらない`);
          }
        }
        if (m.ledger) m.ledger.check().forEach(e => errs.push(`${id}#${i}: ${e}`));
      } catch (e) { errs.push(`${id}#${i}: ${e.message}`); break; }
    }
  }
  // レッスン構造
  for (const l of Object.values(Game.lessons)) {
    let run = 0;
    (l.steps || []).forEach((st, i) => {
      if (st.q) { if (!Game.Q[st.q]) errs.push(`${l.id} 手順${i + 1}: 未登録の問題 ${st.q}`); run = 0; }
      else if (st.s || st.d) { run++; if (run > 3) errs.push(`${l.id} 手順${i + 1}: 説明が4画面以上連続`); }
      if (st.d && !Game.diagrams[st.d]) errs.push(`${l.id} 手順${i + 1}: 未登録の図 ${st.d}`);
      if (st.s && st.s !== 'narr' && !Game.castDefs[st.s]) errs.push(`${l.id} 手順${i + 1}: 未登録の人物 ${st.s}`);
      for (const t of st.terms || []) if (!Game.terms[t]) errs.push(`${l.id}: 未登録の用語 ${t}`);
      if (st.txn) { try { const L = new Ledger(st.ledger?.open || {}); L.post(st.txn); L.check().forEach(e => errs.push(`${l.id} 手順${i + 1}: ${e}`)); } catch (e) { errs.push(`${l.id} 手順${i + 1}: ${e.message}`); } }
    });
  }
  for (const ch of Game.chapters) {
    const ex = ch.exam; if (!ex) continue;
    const pool = ex.pool || [];
    pool.forEach(id => { if (!Game.Q[id]) errs.push(`${ex.id}: 未登録の問題 ${id}`); else if (Game.Q[id].rare) errs.push(`${ex.id}: 相談の問題は入れない ${id}`); });
    if (pool.length < (ex.n || 15)) errs.push(`${ex.id}: 問題の候補 ${pool.length} が出題数 ${ex.n || 15} より少ない`);
    const sk = new Set(pool.map(id => Game.Q[id]?.skill).filter(Boolean));
    if (sk.size > (ex.n || 15)) errs.push(`${ex.id}: 課題の数 ${sk.size} が出題数より多い`);
  }
  for (const s of Object.values(Game.skills)) {
    if (!Object.values(Game.Q).some(q => q.skill === s.id && !q.rare)) errs.push(`課題 ${s.id} に問題がない`);
    if (s.item && !Game.items[s.item]) errs.push(`課題 ${s.id} の設備 ${s.item} が未登録`);
  }
  for (const q of Object.values(Game.Q)) {
    for (const k of ['myth']) void k;
  }
  for (const c of Object.values(Game.cards)) {
    try { const e = Ledger.effect(c.open || {}, c.txn(), c.rows); e.ledger.check().forEach(x => errs.push(`カード ${c.id}: ${x}`)); }
    catch (e) { errs.push(`カード ${c.id}: ${e.message}`); }
  }
  // 会計エンジンそのものの検査（ランダムな取引列で3表が一致するか）
  const R = U.rng(42), kinds = ['capital', 'borrow', 'repay', 'interest', 'dividend', 'buyEquip', 'depreciate', 'buyStockCash', 'buyStockCredit', 'payAP', 'collectAR', 'salary', 'rent', 'tax', 'sales'];
  for (let k = 0; k < 40; k++) {
    const L = new Ledger({'現金': 1000, '資本金': 800, '借入金': 200});
    for (let j = 0; j < 25; j++) {
      const kind = R.pick(kinds), x = R.int(1, 30) * 10;
      L.post(Txn[kind](x));
      if (R.chance(.3)) L.post(R.chance(.5) ? Txn.sellCash(x * 2, x) : Txn.sellCredit(x * 2, x));
    }
    L.check().forEach(e => errs.push('会計エンジン: ' + e));
  }
  const res = {ok: errs.length === 0, errs, count, ms: Math.round(performance.now() - t0)};
  Game.testResult = res;
  if (errs.length) console.warn('自己検査で問題が見つかりました', errs); else console.info(`自己検査OK: ${count}問生成 ${res.ms}ms`);
  return res;
};
})();

/* ---------------- 問題形式 ----------------
   各形式は次の関数を持つ:
     prepare(q, p, rng) → モデル（正解など）     render(m, root, ready) → 操作部品を描く
     read(m, root) → 解答                         grade(m, ans) → {ok, trap, answerHtml, marks}
     reveal(m, root, res) → 正誤の印をつける       validate(m) → 自己検査のエラー配列
   共通の項目: type, skill, gen(rng)→p, text(p), hint(p), explain(p), show:['数値を本文に出す変数']
-------------------------------------------- */
(function(){
const {U} = Game, f = U.fmt;
const near = (a, b, tol = 0) => Math.abs(a - b) <= tol + 1e-9;
const trapOf = (m, why) => why ? {myth: why.myth || null, why: U.val(why.why, m.p)} : null;

/* テンキー（スマホのキーボードを出さずに数値入力するため） */
const Tenkey = Game.Tenkey = {
  html(dec){
    const k = (v, lab, cls = '') => `<button type="button" class="tk ${cls}" data-k="${v}" aria-label="${lab}">${lab}</button>`;
    return `<div class="tenkey" role="group" aria-label="数字キー">
      ${k(7, '7')}${k(8, '8')}${k(9, '9')}${k('bs', '⌫', 'tk-op')}
      ${k(4, '4')}${k(5, '5')}${k(6, '6')}${k('c', 'C', 'tk-op')}
      ${k(1, '1')}${k(2, '2')}${k(3, '3')}${k('neg', '±', 'tk-op')}
      ${k(0, '0', 'tk-wide')}${k('00', '00')}${dec ? k('.', '.') : '<span></span>'}
    </div>`;
  },
  apply(s, key){
    if (key === 'bs') return s.slice(0, -1) === '-' ? '' : s.slice(0, -1);
    if (key === 'c') return '';
    if (key === 'neg') return s.startsWith('-') ? s.slice(1) : '-' + s;
    if (key === '.') return s.includes('.') ? s : (s.replace('-', '') === '' ? s + '0.' : s + '.');
    const digits = s.replace(/[-.]/g, '');
    if (digits.length >= 10) return s;
    let t = s + key;
    t = t.replace(/^(-?)0+(\d)/, '$1$2');
    return t;
  },
  show(s){
    if (s === '' || s === '-') return s === '-' ? '−' : '';
    const neg = s.startsWith('-'), body = neg ? s.slice(1) : s;
    const [i, d] = body.split('.');
    const ii = (i || '0').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '−' : '') + ii + (d !== undefined ? '.' + d : '');
  },
  bind(root, onKey){
    root.addEventListener('click', e => {
      const b = e.target.closest('.tk'); if (!b || b.disabled) return;
      Game.Sound.play('tap'); onKey(String(b.dataset.k));
    });
  },
};
// 物理キーボードからの入力（PC用）。アクティブなテンキーに送る
document.addEventListener('keydown', e => {
  const t = Game.activeTenkey; if (!t || e.ctrlKey || e.metaKey || e.altKey) return;
  let k = null;
  if (/^[0-9]$/.test(e.key)) k = e.key; else if (e.key === 'Backspace') k = 'bs';
  else if (e.key === '-' ) k = 'neg'; else if (e.key === '.') k = '.'; else if (e.key === 'Escape') k = 'c';
  if (k) { e.preventDefault(); t(k); }
});

/* 選択（4択など）
   options(p) → [{t:'選択肢', ok:true} , {t:'誤答', myth:'思い込みID', why:'この誤答への解説'}]  keep:true で並べ替えない */
Game.questionType('choice', {
  prepare(q, p, r){
    const opts = U.val(q.options, p).map((o, i) => Object.assign({i}, o));
    return {opts: q.keep ? opts : r.shuffle(opts)};
  },
  render(m, root, ready){
    root.innerHTML = `<div class="opts">${m.opts.map((o, i) => `<button type="button" class="opt" data-i="${i}"><span class="opt-key">${i + 1}</span><span class="opt-t">${U.rich(o.t)}</span></button>`).join('')}</div>`;
    root.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || root.dataset.locked) return;
      U.$$('.opt', root).forEach(x => x.classList.toggle('sel', x === b)); Game.Sound.play('pick'); ready(true);
    });
    m._key = e => { const n = Number(e.key); if (n >= 1 && n <= m.opts.length) U.$$('.opt', root)[n - 1].click(); };
  },
  read(m, root){ const b = U.$('.opt.sel', root); return b ? Number(b.dataset.i) : null; },
  grade(m, a){
    const o = m.opts[a], ok = !!o.ok, right = m.opts.find(x => x.ok);
    return {ok, trap: ok ? null : (o.why || o.myth ? {myth: o.myth, why: U.val(o.why, m.p)} : null), answerHtml: U.rich(right.t)};
  },
  reveal(m, root, res, a){
    U.$$('.opt', root).forEach((b, i) => { if (m.opts[i].ok) b.classList.add('right'); else if (i === a) b.classList.add('wrong'); });
  },
  validate(m){
    const e = [], n = m.opts.filter(o => o.ok).length;
    if (n !== 1) e.push(`正解の選択肢が${n}個`);
    if (new Set(m.opts.map(o => o.t)).size !== m.opts.length) e.push('選択肢が重複');
    return e;
  },
});

/* 数値入力
   solve(p) → 正解  unit:'万円'  dec:小数桁(省略時0=整数)  tol:許容誤差
   traps:[{v:p=>値, myth:'ID', why:'その値になる典型的な誤り'}] */
Game.questionType('number', {
  prepare(q, p){
    const ans = q.solve(p);
    const traps = (q.traps || []).map(t => ({value: t.v(p), myth: t.myth || null, why: U.val(t.why, p)})).filter(t => !near(t.value, ans));
    return {ans, traps, unit: U.val(q.unit, p) || '', dec: q.dec || 0, tol: q.tol || 0, s: ''};
  },
  render(m, root, ready){
    root.innerHTML = `<div class="numrow"><output class="numdisp" aria-live="polite">　</output><span class="unit">${U.esc(m.unit)}</span></div>${Tenkey.html(m.dec > 0)}`;
    const disp = U.$('.numdisp', root);
    const upd = () => { disp.textContent = Tenkey.show(m.s) || '　'; disp.classList.toggle('empty', !m.s); ready(/\d/.test(m.s)); };
    const onKey = k => { if (root.dataset.locked) return; m.s = Tenkey.apply(m.s, k); upd(); };
    Tenkey.bind(root, onKey); Game.activeTenkey = onKey; upd();
  },
  read(m){ return /\d/.test(m.s) ? Number(m.s) : null; },
  grade(m, a){
    const ok = near(a, m.ans, m.tol);
    const t = ok ? null : m.traps.find(t => near(t.value, a));
    return {ok, trap: t ? {myth: t.myth, why: t.why} : null, answerHtml: `${f(m.ans)}${U.esc(m.unit)}`};
  },
  reveal(m, root, res){ U.$('.numdisp', root).classList.add(res.ok ? 'right' : 'wrong'); U.$$('.tk', root).forEach(b => b.disabled = true); },
  validate(m){
    const e = [];
    if (typeof m.ans !== 'number' || !isFinite(m.ans)) e.push('答えが数値でない: ' + m.ans);
    else if (!m.dec && !U.isInt(m.ans)) e.push('答えが整数でない: ' + m.ans);
    else if (m.dec && !U.isInt(m.ans * 10 ** m.dec)) e.push(`答えが小数${m.dec}桁に収まらない: ${m.ans}`);
    if (Math.abs(m.ans) >= 1e10) e.push('答えが大きすぎる');
    return e;
  },
});

/* 数値予想（スライダー）。予想させてから実際の値を見せる
   solve(p) min max step tol(この差以内なら的中) unit  surprise(p, ans)→結果の一言 */
Game.questionType('estimate', {
  prepare(q, p){
    const ans = q.solve(p), min = U.val(q.min, p), max = U.val(q.max, p), step = U.val(q.step, p) || 1;
    return {ans, min, max, step, tol: U.val(q.tol, p) ?? step * 3, unit: U.val(q.unit, p) || '', v: U.val(q.start, p) ?? min, touched: false};
  },
  render(m, root, ready){
    root.innerHTML = `<div class="est">
      <div class="numrow"><output class="numdisp">${f(m.v)}</output><span class="unit">${U.esc(m.unit)}</span></div>
      <div class="est-row"><button type="button" class="tk tk-op est-dn" aria-label="減らす">−</button>
      <input type="range" class="est-range" id="est-${m.seed}" min="${m.min}" max="${m.max}" step="${m.step}" value="${m.v}" aria-label="予想値">
      <button type="button" class="tk tk-op est-up" aria-label="増やす">＋</button></div>
      <div class="est-scale"><span>${f(m.min)}</span><span>${f(m.max)}</span></div></div>`;
    const rg = U.$('.est-range', root), disp = U.$('.numdisp', root);
    const set = v => { m.v = U.clamp(Math.round(v / m.step) * m.step, m.min, m.max); rg.value = m.v; disp.textContent = f(m.v); m.touched = true; ready(true); };
    rg.addEventListener('input', () => { if (!root.dataset.locked) { set(Number(rg.value)); Game.Sound.play('blip'); } });
    U.$('.est-dn', root).addEventListener('click', () => { if (!root.dataset.locked) { set(m.v - m.step); Game.Sound.play('tap'); } });
    U.$('.est-up', root).addEventListener('click', () => { if (!root.dataset.locked) { set(m.v + m.step); Game.Sound.play('tap'); } });
    ready(false);
  },
  read(m){ return m.touched ? m.v : null; },
  grade(m, a){
    const d = a - m.ans, ok = Math.abs(d) <= m.tol + 1e-9;
    const s = m.q.surprise ? U.val(m.q.surprise, m.p, m.ans) : '';
    return {ok, trap: null, answerHtml: `実際は <b>${f(m.ans)}${U.esc(m.unit)}</b>（あなたの予想 ${f(a)}${U.esc(m.unit)}、差 ${d > 0 ? '+' : ''}${f(d)}）${s ? '<br>' + U.rich(s) : ''}`};
  },
  reveal(m, root, res, a){
    const est = U.$('.est', root);
    const pos = v => ((v - m.min) / (m.max - m.min) * 100).toFixed(1) + '%';
    est.insertAdjacentHTML('beforeend', `<div class="est-reveal"><i class="mk mk-you" style="left:${pos(a)}"></i><i class="mk mk-ans" style="left:${pos(m.ans)}"></i></div><div class="est-legend"><span class="lg-you">あなたの予想</span><span class="lg-ans">実際</span></div>`);
    U.$('.est-range', root).disabled = true; U.$$('.tk', root).forEach(b => b.disabled = true);
  },
  validate(m){
    const e = [];
    if (!(m.ans >= m.min && m.ans <= m.max)) e.push(`正解${m.ans}が範囲外 ${m.min}〜${m.max}`);
    if (!U.isInt(m.ans / m.step)) e.push(`正解${m.ans}が目盛り${m.step}に乗らない`);
    return e;
  },
});

/* 並べ替え: items(p) → 正しい順の配列（文字列）。タップした順に並ぶ */
Game.questionType('order', {
  prepare(q, p, r){
    const items = U.val(q.items, p);
    let sh = r.shuffle(items.map((t, i) => ({t, i})));
    if (items.length > 1 && sh.every((x, k) => x.i === k)) sh = sh.slice(1).concat(sh[0]);
    return {items, sh, seq: []};
  },
  render(m, root, ready){
    const draw = () => {
      root.innerHTML = `<ol class="ord-seq">${m.items.map((_, k) => { const x = m.seq[k]; return `<li class="ord-slot ${x ? 'filled' : ''}" ${x ? `data-j="${k}"` : ''}><span class="ord-n">${k + 1}</span><span class="ord-t">${x ? U.rich(x.t) : '　'}</span></li>`; }).join('')}</ol>
        <div class="ord-pool">${m.sh.filter(x => !m.seq.includes(x)).map(x => `<button type="button" class="chip" data-i="${x.i}">${U.rich(x.t)}</button>`).join('')}</div>
        <p class="tiny">上から順になるよう、下の札をタップ。並べた札をタップすると戻せます。</p>`;
      ready(m.seq.length === m.items.length);
    };
    root.addEventListener('click', e => {
      if (root.dataset.locked) return;
      const c = e.target.closest('.chip'), s = e.target.closest('.ord-slot.filled');
      if (c) { m.seq.push(m.sh.find(x => x.i === Number(c.dataset.i))); Game.Sound.play('pick'); draw(); }
      else if (s) { m.seq.splice(Number(s.dataset.j), 1); Game.Sound.play('back'); draw(); }
    });
    draw();
  },
  read(m){ return m.seq.length === m.items.length ? m.seq.map(x => x.i) : null; },
  grade(m, a){
    const marks = a.map((i, k) => i === k), ok = marks.every(Boolean);
    let trap = null;
    if (!ok) {
      // trapFn(ユーザーの並び順の文字列配列, p) → {myth, why} で誤り方に応じた解説を返せる
      if (m.q.trapFn) trap = m.q.trapFn(a.map(i => m.items[i]), m.p) || null;
      else if (m.q.myth || m.q.why) trap = {myth: m.q.myth || null, why: U.val(m.q.why, m.p)};
    }
    return {ok, marks, trap, answerHtml: m.items.map((t, k) => `${k + 1}. ${U.rich(t)}`).join('<br>')};
  },
  reveal(m, root, res){ U.$$('.ord-slot', root).forEach((li, k) => li.classList.add(res.marks[k] ? 'right' : 'wrong')); },
  validate(m){ return m.items.length < 2 ? ['項目が2つ未満'] : (new Set(m.items).size !== m.items.length ? ['項目が重複'] : []); },
});

/* 振り分け: bins:['借入','出資']  items(p) → [{t:'項目', bin:0, myth?, why?}]  pick:n で出題数を絞る */
Game.questionType('sort', {
  prepare(q, p, r){
    let items = U.val(q.items, p).map(x => Object.assign({}, x));
    if (q.pick && items.length > q.pick) {
      // 各箱から最低1つは出す
      const bins = U.val(q.bins, p), chosen = [];
      bins.forEach((_, b) => { const c = r.shuffle(items.filter(x => x.bin === b))[0]; if (c) chosen.push(c); });
      const rest = r.shuffle(items.filter(x => !chosen.includes(x)));
      items = chosen.concat(rest).slice(0, q.pick);
    }
    return {bins: U.val(q.bins, p), items: r.shuffle(items), sel: {}};
  },
  render(m, root, ready){
    root.innerHTML = `<div class="sort">${m.items.map((x, i) => `<div class="sort-row" data-i="${i}"><div class="sort-t">${U.rich(x.t)}</div><div class="seg" role="radiogroup">${m.bins.map((b, j) => `<button type="button" class="seg-b" data-j="${j}" role="radio" aria-checked="false">${U.esc(b)}</button>`).join('')}</div></div>`).join('')}</div>`;
    root.addEventListener('click', e => {
      const b = e.target.closest('.seg-b'); if (!b || root.dataset.locked) return;
      const row = b.closest('.sort-row'), i = Number(row.dataset.i);
      m.sel[i] = Number(b.dataset.j);
      U.$$('.seg-b', row).forEach(x => { const on = x === b; x.classList.toggle('sel', on); x.setAttribute('aria-checked', on); });
      Game.Sound.play('pick'); ready(Object.keys(m.sel).length === m.items.length);
    });
  },
  read(m){ return Object.keys(m.sel).length === m.items.length ? m.items.map((_, i) => m.sel[i]) : null; },
  grade(m, a){
    const marks = a.map((b, i) => b === m.items[i].bin), ok = marks.every(Boolean);
    const bad = m.items.find((x, i) => !marks[i] && (x.why || x.myth));
    return {ok, marks, trap: bad ? {myth: bad.myth, why: U.val(bad.why, m.p)} : null,
      answerHtml: m.items.map(x => `${U.rich(x.t)} → <b>${U.esc(m.bins[x.bin])}</b>`).join('<br>')};
  },
  reveal(m, root, res){
    U.$$('.sort-row', root).forEach((row, i) => {
      row.classList.add(res.marks[i] ? 'right' : 'wrong');
      U.$$('.seg-b', row).forEach((b, j) => { if (j === m.items[i].bin) b.classList.add('ans'); });
    });
  },
  validate(m){ return m.items.some(x => !(x.bin >= 0 && x.bin < m.bins.length)) ? ['箱の番号が範囲外'] : []; },
});

/* 穴埋め（表）: rows(p) → [{label, v, blank:true, side:'L'|'R', total:true}]  layout:'bs'（左右2列）|'list'  unit */
Game.questionType('fill', {
  prepare(q, p){
    const rows = U.val(q.rows, p).map(x => Object.assign({}, x));
    const blanks = rows.map((x, i) => x.blank ? i : -1).filter(i => i >= 0);
    return {rows, blanks, layout: q.layout || 'list', unit: U.val(q.unit, p) || '', vals: {}, cur: blanks[0], titles: U.val(q.titles, p) || ['資産', '負債・純資産']};
  },
  render(m, root, ready){
    const cell = i => {
      const x = m.rows[i];
      if (!x.blank) return `<span class="fv">${f(x.v)}</span>`;
      const s = m.vals[i] || '';
      return `<button type="button" class="fblank ${m.cur === i ? 'cur' : ''} ${s ? '' : 'empty'}" data-i="${i}" aria-label="${U.esc(x.label)}の空欄">${s ? Tenkey.show(s) : '？'}</button>`;
    };
    const row = i => { const x = m.rows[i]; return `<div class="frow ${x.total ? 'ftotal' : ''} ${x.head ? 'fhead' : ''}"><span class="fl">${U.rich(x.label)}</span>${x.head ? '' : cell(i)}</div>`; };
    const draw = () => {
      const idx = m.rows.map((_, i) => i);
      let body;
      if (m.layout === 'bs') {
        body = `<div class="fbs"><div class="fcol"><div class="fcap">${U.esc(m.titles[0])}</div>${idx.filter(i => m.rows[i].side !== 'R').map(row).join('')}</div><div class="fcol"><div class="fcap">${U.esc(m.titles[1])}</div>${idx.filter(i => m.rows[i].side === 'R').map(row).join('')}</div></div>`;
      } else body = `<div class="flist">${idx.map(row).join('')}</div>`;
      U.$('.fill-body', root).innerHTML = body + `<p class="tiny">単位：${U.esc(m.unit)}　「？」をタップして数字を入れる</p>`;
      ready(m.blanks.every(i => /\d/.test(m.vals[i] || '')));
    };
    root.innerHTML = `<div class="fill-body"></div>${Tenkey.html(false)}`;
    root.addEventListener('click', e => {
      const b = e.target.closest('.fblank'); if (!b || root.dataset.locked) return;
      m.cur = Number(b.dataset.i); Game.Sound.play('tap'); draw();
    });
    const onKey = k => {
      if (root.dataset.locked || m.cur == null) return;
      m.vals[m.cur] = Tenkey.apply(m.vals[m.cur] || '', k); draw();
    };
    Tenkey.bind(root, onKey); Game.activeTenkey = onKey;
    m._next = () => { const k = m.blanks.indexOf(m.cur); m.cur = m.blanks[(k + 1) % m.blanks.length]; draw(); };
    draw();
  },
  read(m){ return m.blanks.every(i => /\d/.test(m.vals[i] || '')) ? m.blanks.map(i => Number(m.vals[i])) : null; },
  grade(m, a){
    const marks = m.blanks.map((i, k) => near(a[k], m.rows[i].v)), ok = marks.every(Boolean);
    return {ok, marks, trap: null, answerHtml: m.blanks.map(i => `${U.rich(m.rows[i].label)}：<b>${f(m.rows[i].v)}</b>`).join('　')};
  },
  reveal(m, root, res){
    m.cur = null;
    U.$$('.fblank', root).forEach(b => { const k = m.blanks.indexOf(Number(b.dataset.i)); b.classList.remove('cur'); b.classList.add(res.marks[k] ? 'right' : 'wrong'); if (!res.marks[k]) b.insertAdjacentHTML('afterend', `<span class="fcorr">${f(m.rows[Number(b.dataset.i)].v)}</span>`); });
    U.$$('.tk', root).forEach(b => b.disabled = true);
  },
  validate(m){
    const e = [];
    m.blanks.forEach(i => { if (!U.isInt(m.rows[i].v)) e.push(`空欄 ${m.rows[i].label} の答えが整数でない: ${m.rows[i].v}`); });
    if (!m.blanks.length) e.push('空欄がない');
    if (m.layout === 'bs') {
      const tot = side => m.rows.filter(x => !x.total && !x.head && (side === 'R' ? x.side === 'R' : x.side !== 'R')).reduce((s, x) => s + x.v, 0);
      if (!near(tot('L'), tot('R'))) e.push(`表の左右が一致しない ${tot('L')} ≠ ${tot('R')}`);
    }
    return e;
  },
});

/* 判断（結論と根拠の2段階）: concl(p) → [{t, ok}]  reasons(p) → [{t, ok, myth, why}] */
Game.questionType('judge', {
  prepare(q, p, r){
    return {concl: r.shuffle(U.val(q.concl, p)), reasons: r.shuffle(U.val(q.reasons, p)), a: null, b: null};
  },
  render(m, root, ready){
    const grp = (name, arr, key) => `<div class="jg"><div class="jg-h">${name}</div><div class="opts">${arr.map((o, i) => `<button type="button" class="opt" data-g="${key}" data-i="${i}"><span class="opt-t">${U.rich(o.t)}</span></button>`).join('')}</div></div>`;
    root.innerHTML = grp('結論', m.concl, 'a') + grp('根拠', m.reasons, 'b');
    root.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b || root.dataset.locked) return;
      m[b.dataset.g] = Number(b.dataset.i);
      U.$$(`.opt[data-g="${b.dataset.g}"]`, root).forEach(x => x.classList.toggle('sel', x === b));
      Game.Sound.play('pick'); ready(m.a != null && m.b != null);
    });
  },
  read(m){ return m.a != null && m.b != null ? [m.a, m.b] : null; },
  grade(m, [a, b]){
    const okA = !!m.concl[a].ok, okB = !!m.reasons[b].ok, ok = okA && okB;
    const bad = !okB ? m.reasons[b] : (!okA ? m.concl[a] : null);
    return {ok, marks: [okA, okB], trap: bad && (bad.why || bad.myth) ? {myth: bad.myth, why: U.val(bad.why, m.p)} : null,
      answerHtml: `結論：${U.rich(m.concl.find(x => x.ok).t)}<br>根拠：${U.rich(m.reasons.find(x => x.ok).t)}`};
  },
  reveal(m, root, res, [a, b]){
    U.$$('.opt[data-g="a"]', root).forEach((x, i) => { if (m.concl[i].ok) x.classList.add('right'); else if (i === a) x.classList.add('wrong'); });
    U.$$('.opt[data-g="b"]', root).forEach((x, i) => { if (m.reasons[i].ok) x.classList.add('right'); else if (i === b) x.classList.add('wrong'); });
  },
  validate(m){
    const e = [];
    if (m.concl.filter(x => x.ok).length !== 1) e.push('結論の正解が1つでない');
    if (m.reasons.filter(x => x.ok).length !== 1) e.push('根拠の正解が1つでない');
    return e;
  },
});

/* 増減予想: 取引で各項目が 増える/変わらない/減る のどれか
   txn(p) → 仕訳（会計エンジンが正解を計算） open(p) → 期首残高  rows:['現金','借入金']  label:{項目:表示名}
   または rowsFixed(p) → [{t:'表示名', d:1|0|-1}]  card:'取引カードID'（自力で正解すると入手） */
Game.questionType('arrows', {
  prepare(q, p){
    let rows;
    const m = {};
    if (q.txn) {
      const open = U.val(q.open, p) || {}, txn = q.txn(p), names = U.val(q.rows, p);
      const eff = Game.Ledger.effect(open, txn, names);
      rows = names.map(n => ({key: n, t: (q.label && q.label[n]) || n, d: Math.sign(Math.round(eff.delta[n] * 1e6)), delta: eff.delta[n]}));
      Object.assign(m, {open, txn, ledger: eff.ledger});
    } else rows = U.val(q.rowsFixed, p).map(x => Object.assign({}, x));
    return Object.assign(m, {rows, sel: {}});
  },
  render(m, root, ready){
    const btn = (d, lab, sym) => `<button type="button" class="arw arw${d}" data-d="${d}" aria-label="${lab}"><span class="arw-s">${sym}</span><span class="arw-l">${lab}</span></button>`;
    root.innerHTML = `<div class="arrows">${m.rows.map((x, i) => `<div class="arow" data-i="${i}"><div class="arow-t">${U.esc(x.t)}</div><div class="arow-b">${btn(1, '増える', '▲')}${btn(0, '変わらない', '―')}${btn(-1, '減る', '▼')}</div></div>`).join('')}</div>`;
    root.addEventListener('click', e => {
      const b = e.target.closest('.arw'); if (!b || root.dataset.locked) return;
      const row = b.closest('.arow'), i = Number(row.dataset.i);
      m.sel[i] = Number(b.dataset.d);
      U.$$('.arw', row).forEach(x => x.classList.toggle('sel', x === b));
      Game.Sound.play(m.sel[i] > 0 ? 'up' : m.sel[i] < 0 ? 'down' : 'tap');
      ready(Object.keys(m.sel).length === m.rows.length);
    });
  },
  read(m){ return Object.keys(m.sel).length === m.rows.length ? m.rows.map((_, i) => m.sel[i]) : null; },
  grade(m, a){
    const marks = a.map((d, i) => d === m.rows[i].d), ok = marks.every(Boolean);
    const sym = d => d > 0 ? '▲増える' : d < 0 ? '▼減る' : '―変わらない';
    let trap = null;
    if (!ok && m.q.traps) { for (const t of m.q.traps) { if (t.when(a, m.rows)) { trap = {myth: t.myth, why: U.val(t.why, m.p)}; break; } } }
    return {ok, marks, trap, answerHtml: m.rows.map(x => `${U.esc(x.t)}：<b class="${x.d > 0 ? 'c-up' : x.d < 0 ? 'c-dn' : ''}">${sym(x.d)}</b>${x.delta != null && x.delta !== 0 && !/比率/.test(x.key) ? `（${x.delta > 0 ? '+' : ''}${f(x.delta)}）` : ''}`).join('<br>')};
  },
  reveal(m, root, res){
    U.$$('.arow', root).forEach((row, i) => {
      row.classList.add(res.marks[i] ? 'right' : 'wrong');
      U.$$('.arw', row).forEach(b => { if (Number(b.dataset.d) === m.rows[i].d) b.classList.add('ans'); });
    });
  },
  validate(m){ return m.rows.length ? [] : ['項目がない']; },
});
})();

/* 仕訳（借方・貸方）: 取引ごとに、各勘定を「借方（左）／貸方（右）／使わない」に振り分ける
   txn(p) → 仕訳（会計エンジン）  extra(p) → まぎらわしい勘定（使わない側の正解）  open(p) → 期首残高
   traps:[{a:'借入金', side:'dr', myth, why}] … その勘定をその側に置いたときの解説 */
(function(){
const {U} = Game, f = U.fmt;
const SIDE = {dr: '借方', cr: '貸方', none: '使わない'};
const TYPE = {asset: '資産', liab: '負債', equity: '純資産', rev: '収益', exp: '費用'};
const ruleWhy = (a, side) => {
  const d = Game.Acct.defs[a]; if (!d) return '';
  const tn = TYPE[d.type];
  if (d.type === 'asset') return `${a}は${tn}。資産が増えたら借方（左）、減ったら貸方（右）。BSで資産が左側にあるのと同じ向き。`;
  if (d.type === 'liab' || d.type === 'equity') return `${a}は${tn}。${tn}が増えたら貸方（右）、減ったら借方（左）。BSで${tn}が右側にあるのと同じ向き。`;
  if (d.type === 'exp') return `${a}は${tn}。費用は純資産を減らす側なので、発生したら借方（左）に書く。`;
  return `${a}は${tn}。収益は純資産を増やす側なので、発生したら貸方（右）に書く。`;
};
Game.journalLines = txn => {
  const es = Array.isArray(txn) ? txn : [txn], agg = {}, order = [];
  for (const e of es) for (const l of e.lines) { if (!agg[l.a]) { agg[l.a] = {dr: 0, cr: 0}; order.push(l.a); } agg[l.a].dr += l.dr || 0; agg[l.a].cr += l.cr || 0; }
  return order.map(a => ({a, side: agg[a].dr > agg[a].cr ? 'dr' : 'cr', amt: Math.abs(agg[a].dr - agg[a].cr)})).filter(x => x.amt > 0);
};
Game.journalHTML = txn => {
  const L = Game.journalLines(txn), dr = L.filter(x => x.side === 'dr'), cr = L.filter(x => x.side === 'cr'), n = Math.max(dr.length, cr.length);
  let h = '<table class="jt"><thead><tr><th>借方（左）</th><th>金額</th><th>貸方（右）</th><th>金額</th></tr></thead><tbody>';
  for (let i = 0; i < n; i++) h += `<tr><td>${U.esc(dr[i]?.a || '')}</td><td class="num">${dr[i] ? f(dr[i].amt) : ''}</td><td>${U.esc(cr[i]?.a || '')}</td><td class="num">${cr[i] ? f(cr[i].amt) : ''}</td></tr>`;
  return h + '</tbody></table>';
};
Game.questionType('journal', {
  prepare(q, p, r){
    const open = U.val(q.open, p) || {}, txn = q.txn(p), used = Game.journalLines(txn);
    const extra = (U.val(q.extra, p) || []).filter(a => !used.some(x => x.a === a)).map(a => ({a, side: 'none', amt: 0}));
    return {rows: r.shuffle(used.concat(extra)), open, txn, ledger: new Game.Ledger(open).post(txn), sel: {}};
  },
  render(m, root, ready){
    root.innerHTML = `<div class="jr-head"><span>勘定科目</span><span>借方（左）</span><span>貸方（右）</span><span>使わない</span></div><div class="jrows">${m.rows.map((x, i) => `<div class="jrow" data-i="${i}"><div class="jrow-a">${U.esc(x.a)}</div><div class="seg">${['dr', 'cr', 'none'].map(s => `<button type="button" class="seg-b j-${s} ${s === 'none' ? 'sel' : ''}" data-s="${s}" aria-label="${U.esc(x.a)}を${SIDE[s]}に">${SIDE[s]}</button>`).join('')}</div></div>`).join('')}</div><p class="tiny">使う勘定科目を、借方（左）か貸方（右）に振り分ける。金額は問題文のとおり。</p>`;
    m.rows.forEach((_, i) => { m.sel[i] = 'none'; });
    const chk = () => { const v = Object.values(m.sel); ready(v.includes('dr') && v.includes('cr')); };
    root.addEventListener('click', e => {
      const b = e.target.closest('.seg-b'); if (!b || root.dataset.locked) return;
      const row = b.closest('.jrow'), i = Number(row.dataset.i);
      m.sel[i] = b.dataset.s; U.$$('.seg-b', row).forEach(x => x.classList.toggle('sel', x === b));
      Game.Sound.play(b.dataset.s === 'none' ? 'back' : 'pick'); chk();
    });
    chk();
  },
  read(m){ return m.rows.map((_, i) => m.sel[i] || 'none'); },
  grade(m, a){
    const marks = a.map((s, i) => s === m.rows[i].side), ok = marks.every(Boolean);
    let trap = null;
    if (!ok) {
      for (const t of m.q.traps || []) { const i = m.rows.findIndex(x => x.a === t.a); if (i >= 0 && a[i] === t.side) { trap = {myth: t.myth || null, why: U.val(t.why, m.p)}; break; } }
      if (!trap) {
        const used = m.rows.map((x, i) => [x, i]).filter(([x]) => x.side !== 'none');
        if (used.length && used.every(([x, i]) => a[i] !== 'none' && a[i] !== x.side)) trap = {why: '左右が逆になっている。勘定科目の選び方は合っている。' + ruleWhy(used[0][0].a, used[0][0].side)};
        else { const k = m.rows.findIndex((x, i) => !marks[i]); const x = m.rows[k]; trap = {why: x.side === 'none' ? `${x.a}はこの取引では動かない。` : ruleWhy(x.a, x.side)}; }
      }
    }
    return {ok, marks, trap, answerHtml: Game.journalHTML(m.txn)};
  },
  reveal(m, root, res){
    U.$$('.jrow', root).forEach((row, i) => { row.classList.add(res.marks[i] ? 'right' : 'wrong'); U.$$('.seg-b', row).forEach(b => { if (b.dataset.s === m.rows[i].side) b.classList.add('ans'); }); });
  },
  validate(m){
    const e = [], L = Game.journalLines(m.txn);
    if (!L.some(x => x.side === 'dr') || !L.some(x => x.side === 'cr')) e.push('仕訳の片側が空');
    L.forEach(x => { if (!U.isInt(x.amt)) e.push('金額が整数でない ' + x.a); if (!Game.Acct.defs[x.a]) e.push('未登録の勘定 ' + x.a); });
    m.rows.forEach(x => { if (!Game.Acct.defs[x.a]) e.push('未登録の勘定 ' + x.a); });
    return e;
  },
});
})();

/* ---------------- ドット絵（16色パレット・人物・設備・建物・場面） ---------------- */
(function(){
const {U} = Game;
const PAL = Game.PAL = {
  o: '#2b2433', n: '#33405c', b: '#5b7fae', B: '#a9cfe4', t: '#2f6f73', T: '#6fb39f',
  g: '#4f9e5c', R: '#e0583a', r: '#a2453a', y: '#f2c14e', w: '#f6f0e2', s: '#f0c6a0',
  S: '#c98f6b', c: '#6b4129', e: '#c99a5b', a: '#8d8f9c',
};
const hx = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const mixc = (a, b, t) => '#' + hx(a).map((v, i) => Math.round(v + (hx(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');

/* スプライト: 文字列の配列。'.'は透明、それ以外はパレットの文字か、map で指定した色（文字または#色） */
const sprCache = new Map();
Game.sprite = (rows, map = {}, key) => {
  const k = key || (rows.join('|') + JSON.stringify(map));
  if (sprCache.has(k)) return sprCache.get(k);
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const ch = r[x]; if (ch === '.' || ch === ' ') continue; const m = map[ch]; const c = m ? (PAL[m] || m) : PAL[ch]; if (!c) continue; g.fillStyle = c; g.fillRect(x, y, 1, 1); } });
  sprCache.set(k, cv);
  return cv;
};

/* ---------------- 場面の描画（256×144 の固定構図） ----------------

(function(){

/* 描画道具 */

  const C = c => Game.PAL[c] || c;

    // 網点: n=2 市松, n=4 まばら(1/4), n=-4 濃い(3/4)
    dith(x, y, w, h, c, n = 2, ph = 0){
      g.fillStyle = C(c);
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {

        if (on) g.fillRect(X, Y, 1, 1);

    },
    // 縦方向のグラデーション（帯の境目を網点でつなぐ）
    grad(x, y, w, h, cols){

    line(x0, y0, x1, y1, c){

    ring(cx, cy, r, c){ g.fillStyle = C(c); for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++) { const d = Math.sqrt(x * x + y * y); if (d > r - .6 && d < r + .5) g.fillRect(Math.round(cx + x), Math.round(cy + y), 1, 1); } return P; },

/* 設備を店先の歩道に並べる（奥の列→手前の列） */
Game.hubItems = (p, slot, ids, o = {}) => {
  const cx = slot.x + Math.round(slot.w / 2), lo = o.lo ?? 31, hi = o.hi ?? 172, avoid = o.avoid || [[122, 132], [137, 144]];
  const rows = [{y: 118, l: cx - 9, r: cx + 9}, {y: 122, l: cx - 12, r: cx + 12}, {y: 126, l: cx - 16, r: cx + 16}];
  const hit = (a, b) => avoid.some(([u, v]) => a < v && b > u);
  const placed = [];
  ids.forEach((id, i) => {
    const cv = Game.itemSprite(id); if (!cv) return;
    for (const row of rows) {
      if (i % 2 === 0) { let x = row.l - cv.width; while (hit(x, x + cv.width) && x >= lo) x--; if (x >= lo) { row.l = x - 3; placed.push({cv, x, y: row.y - cv.height}); return; } }
      else { let x = row.r; while (hit(x, x + cv.width) && x + cv.width <= hi) x++; if (x + cv.width <= hi) { row.r = x + cv.width + 3; placed.push({cv, x, y: row.y - cv.height}); return; } }
    }
  });
  placed.sort((a, b) => (a.y + a.cv.height) - (b.y + b.cv.height));
  for (const q of placed) { p.alpha(q.x + 1, q.y + q.cv.height - 1, q.cv.width, 2, '#1d1630', .18); p.spr(q.cv, q.x, q.y); }
};

/* ---------------- 文字送り ---------------- */
function typeHTML(el, html, done){
  const atoms = [];
  html.split(/(<[^>]+>|&[^;]+;)/).forEach(tok => { if (!tok) return; if (tok[0] === '<' || (tok[0] === '&' && tok.endsWith(';'))) atoms.push(tok); else for (const ch of tok) atoms.push(ch); });
  let k = 0, stop = false, last = 0;
  const finish = () => { stop = true; el.innerHTML = html; done && done(); };
  if (Game.reduced) { finish(); return finish; }
  const step = t => {
    if (stop) return;
    if (t - last > 28) { last = t; k = Math.min(atoms.length, k + 2); el.innerHTML = atoms.slice(0, k).join(''); if (k % 6 === 0) Sound.play('blip'); }
    if (k >= atoms.length) { stop = true; done && done(); return; }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  return () => { if (!stop) finish(); };
}

/* ---------------- 図 ---------------- */
const bsBoxHTML = (assets, liab, eq, opts = {}) => {
  const sum = a => a.reduce((s, x) => s + Math.max(0, x[1]), 0);
  const tl = sum(assets), tr = sum(liab) + sum(eq), max = Math.max(tl, tr, 1);
  const H = opts.h || 150;
  const blk = (x, cls) => { const h = Math.max(x[1] > 0 ? 24 : 0, Math.round(Math.max(0, x[1]) / max * H)); return x[1] > 0 ? `<div class="bb ${cls}" data-k="${esc(x[0])}" style="height:${h}px"><span class="bb-n">${esc(x[0])}</span><span class="bb-v" data-v="${x[1]}">${f(x[1])}</span></div>` : ''; };
  const neg = [...assets, ...liab, ...eq].filter(x => x[1] < 0);
  return `<div class="bsbox">
    <div class="bs-col"><div class="bs-h">資産<small>使い道</small></div><div class="bs-stack">${assets.map(x => blk(x, 'bb-a')).join('')}</div><div class="bs-t">合計 <b>${f(tl)}</b></div></div>
    <div class="bs-col"><div class="bs-h">負債＋純資産<small>集め方</small></div><div class="bs-stack">${liab.map(x => blk(x, 'bb-l')).join('')}${eq.map(x => blk(x, 'bb-e')).join('')}</div><div class="bs-t">合計 <b>${f(tr)}</b></div></div>
  </div>${neg.length ? `<p class="tiny">マイナスの項目：${neg.map(x => `${esc(x[0])} ${f(x[1])}`).join('、')}</p>` : ''}`;
};
Game.diagram('bsbox', d => bsBoxHTML(d.assets || [], d.liab || [], d.eq || [], d) + (d.note ? `<p class="dg-note">${rich(d.note)}</p>` : ''));
Game.diagram('compare', d => `<div class="tbl-wrap"><table class="tbl"><thead><tr><th></th>${d.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r => `<tr><th>${rich(r[0])}</th>${r.slice(1).map(c => `<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${d.note ? `<p class="dg-note">${rich(d.note)}</p>` : ''}`);
Game.diagram('table', d => `<div class="tbl-wrap"><table class="tbl"><thead><tr>${d.head.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r => `<tr>${r.map((c, i) => i ? `<td>${rich(String(c))}</td>` : `<th>${rich(String(c))}</th>`).join('')}</tr>`).join('')}</tbody></table></div>${d.note ? `<p class="dg-note">${rich(d.note)}</p>` : ''}`);
Game.diagram('flow', d => {
  // nodes:[{id,label,x,y,kind}] 座標は 0〜100 × 0〜60 / edges:[{a,b,label}]
  const N = Object.fromEntries(d.nodes.map(n => [n.id, n]));
  const bw = 26, bh = 11;
  const edge = e => {
    const A = N[e.a], B = N[e.b], dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
    const sx = A.x + dx / len * Math.min(bw / 2 + 1, Math.abs(len / 2 - 1)) , sy = A.y + dy / len * (bh / 2 + 2);
    const ex = B.x - dx / len * (bw / 2 + 1), ey = B.y - dy / len * (bh / 2 + 2);
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2 + (e.dy || 0);
    return `<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" class="fl-e" marker-end="url(#ah)"/>${e.label ? `<text x="${mx.toFixed(1)}" y="${(my - 1.5).toFixed(1)}" class="fl-el">${esc(e.label)}</text>` : ''}`;
  };
  const node = n => `<g class="fl-n ${n.kind || ''}"><rect x="${n.x - bw / 2}" y="${n.y - bh / 2}" width="${bw}" height="${bh}" rx="0"/><text x="${n.x}" y="${n.y + 2.2}">${esc(n.label)}</text></g>`;
  return `<div class="flow"><svg viewBox="0 0 100 ${d.h || 60}" role="img" aria-label="${esc(d.alt || '関係図')}"><defs><marker id="ah" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" class="fl-ah"/></marker></defs>${d.edges.map(edge).join('')}${d.nodes.map(node).join('')}</svg></div>${d.note ? `<p class="dg-note">${rich(d.note)}</p>` : ''}`;
});
Game.diagram('bars', d => {
  // groups:[{label, parts:[{label, v, c:'a'|'l'|'e'|'up'|'dn'}]}] unit
  const tot = g => g.parts.reduce((s, x) => s + Math.abs(x.v), 0), max = Math.max(...d.groups.map(tot), 1);
  return `<div class="bars">${d.groups.map(g => `<div class="bar-g"><div class="bar-l">${rich(g.label)}</div><div class="bar-track">${g.parts.map(x => `<span class="bar-p bp-${x.c || 'a'}" style="width:${(Math.abs(x.v) / max * 100).toFixed(1)}%"><i>${esc(x.label)} ${f(x.v)}</i></span>`).join('')}</div>${g.note ? `<div class="bar-n">${rich(g.note)}</div>` : ''}</div>`).join('')}</div>${d.note ? `<p class="dg-note">${rich(d.note)}</p>` : ''}`;
});

/* ---------------- 帳簿パネル（BS・PL・CF） ---------------- */
class Panel {
  constructor(root){ this.root = root; this.tabs = []; this.tab = 'bs'; this.L = new Game.Ledger({}); this.prev = null; this.caption = ''; }
  setTabs(tabs){ const nt = tabs && tabs.length ? tabs : ['bs']; if (nt.join() !== this.tabs.join() || !nt.includes(this.tab)) { this.tabs = nt; this.tab = nt[0]; } }
  reset(open, caption){ this.L = new Game.Ledger(open || {}); this.prev = null; this.caption = caption || ''; this.draw(); }
  metricsX(){
    const m = this.L.metrics(), p = this.L.pl();
    m.__exp = p.cogs + p.sgaTotal + p.nonopExp.reduce((a, x) => a + x[1], 0) + p.extraLoss.reduce((a, x) => a + x[1], 0) + p.tax;
    m.__rev = p.sales + p.nonopInc.reduce((a, x) => a + x[1], 0) + p.extraInc.reduce((a, x) => a + x[1], 0);
    return m;
  }
  apply(txn, caption){
    this.prev = this.metricsX();
    this.L.post(txn); if (caption !== undefined) this.caption = caption;
    this.draw(true);
  }
  draw(anim){
    const L = this.L, b = L.bs(), p = L.pl(), c = L.cfs(), prev = this.prev;
    const T = {bs: '貸借対照表 BS', pl: '損益計算書 PL', cf: 'キャッシュフロー計算書 CF', all: '3表のつながり'};
    const row = (label, v, key, cls = '') => {
      const pv = prev ? (prev[key ?? label] ?? 0) : v, d = v - pv;
      return `<div class="lr ${cls} ${anim && d > 1e-9 ? 'up' : anim && d < -1e-9 ? 'dn' : ''}"><span>${esc(label)}</span><b data-to="${v}" data-from="${anim ? pv : v}">${f(anim ? pv : v)}</b>${anim && Math.abs(d) > 1e-9 ? `<em>${d > 0 ? '+' : ''}${f(d)}</em>` : ''}</div>`;
    };
    let body = '';
    if (this.tab === 'bs') {
      const mark = (arr) => arr.map(x => { const k = x[0] === '利益剰余金' ? '利益剰余金' : x[0]; const pv = prev ? (prev[k] ?? 0) : x[1]; return [x[0], x[1], anim ? Math.sign(Math.round((x[1] - pv) * 1e6)) : 0]; });
      body = bsBoxHTML(b.assets, b.liab, b.eq, {h: 120}).replace(/data-k="([^"]+)"/g, (s, k) => {
        const all = mark([...b.assets, ...b.liab, ...b.eq]); const it = all.find(x => x[0] === k);
        return s + (it && it[2] ? ` data-d="${it[2]}"` : '');
      });
    } else if (this.tab === 'pl') {
      body = `<div class="lrs">${row('売上高', p.sales)}${p.cogs ? row('売上原価', p.cogs) : ''}${row('売上総利益', p.gross, '売上総利益', 'sub')}${p.sga.map(x => row(x[0], x[1])).join('')}${row('営業利益', p.op, '営業利益', 'sub')}${p.nonopInc.map(x => row(x[0], x[1])).join('')}${p.nonopExp.map(x => row(x[0], x[1])).join('')}${row('経常利益', p.ord, '経常利益', 'sub')}${p.extraInc.map(x => row(x[0], x[1])).join('')}${p.extraLoss.map(x => row(x[0], x[1])).join('')}${p.extraInc.length || p.extraLoss.length ? row('税引前当期純利益', p.pre, '税引前当期純利益', 'sub') : ''}${p.tax ? row('法人税等', p.tax) : ''}${row('当期純利益', p.ni, '当期純利益', 'tot')}</div>`;
    } else if (this.tab === 'all') {
      // 3表まとめ：①当期純利益→利益剰余金 ②期末の現金＝BSの現金
      const exp = p.cogs + p.sgaTotal + p.nonopExp.reduce((a, x) => a + x[1], 0) + p.extraLoss.reduce((a, x) => a + x[1], 0) + p.tax;
      const rev = p.sales + p.nonopInc.reduce((a, x) => a + x[1], 0) + p.extraInc.reduce((a, x) => a + x[1], 0);
      const tag = n => `<i class="lk lk${n}">${n === 1 ? '①' : '②'}</i>`;
      const rowT = (label, v, key, cls, n) => row(label, v, key, cls).replace('<span>', `<span>${n ? tag(n) : ''}`);
      body = `<div class="all3">
        <section class="a3"><h4>PL<small>1年の稼ぎ</small></h4><div class="lrs">${row('収益（売上など）', rev, '__rev')}${row('費用（原価・税なども）', exp, '__exp')}${rowT('当期純利益', p.ni, '当期純利益', 'tot', 1)}</div></section>
        <section class="a3"><h4>BS<small>いまの財産</small></h4><div class="lrs">${b.assets.map(x => rowT(x[0], x[1], x[0], '', x[0] === '現金' ? 2 : 0)).join('')}${row('資産合計', b.ta, '総資産', 'sub')}${b.liab.map(x => row(x[0], x[1])).join('')}${b.eq.map(x => rowT(x[0], x[1], x[0], '', x[0] === '利益剰余金' ? 1 : 0)).join('')}${row('負債＋純資産', b.tl + b.te, '総資産', 'sub')}</div></section>
        <section class="a3"><h4>CF<small>1年の現金の出入り</small></h4><div class="lrs">${row('営業CF', c.op)}${row('投資CF', c.inv)}${row('財務CF', c.fin)}${rowT('期末の現金', c.endCash, '期末現金', 'tot', 2)}</div></section>
        <p class="a3-note">${tag(1)} 当期純利益は利益剰余金（純資産）に積み上がる　${tag(2)} 期末の現金はBSの現金と一致する</p></div>`;
    } else {
      body = `<div class="lrs">${row('営業CF', c.op)}${row('投資CF', c.inv)}${row('財務CF', c.fin)}${row('現金の増減', c.change, '現金の増減', 'sub')}<div class="lr"><span>期首の現金</span><b>${f(c.openCash)}</b></div>${row('期末の現金', c.endCash, '期末現金', 'tot')}</div>`;
    }
    this.root.innerHTML = `<div class="ledger-in">
      <div class="lg-tabs" role="tablist">${this.tabs.map(t => `<button type="button" role="tab" aria-selected="${t === this.tab}" class="lg-tab ${t === this.tab ? 'on' : ''}" data-t="${t}">${t === 'all' ? '3表' : t.toUpperCase()}</button>`).join('')}<span class="lg-name">${T[this.tab]}</span></div>
      <div class="lg-body">${body}</div>
      ${this.caption ? `<div class="lg-cap">${rich(this.caption)}</div>` : ''}<div class="lg-unit">単位：万円</div></div>`;
    $$('.lg-tab', this.root).forEach(bt => bt.onclick = () => { this.tab = bt.dataset.t; this.prev = null; Sound.play('tap'); this.draw(); });
    if (anim) {
      $$('.bb[data-d]', this.root).forEach(el => el.classList.add(el.dataset.d > 0 ? 'up' : 'dn'));
      const nums = $$('b[data-to]', this.root).filter(el => el.dataset.to !== el.dataset.from);
      const t0 = performance.now();
      const tick = t => { const k = Math.min(1, (t - t0) / 600); nums.forEach(el => { const a = +el.dataset.from, z = +el.dataset.to; el.textContent = f(Math.round(a + (z - a) * k)); }); if (k < 1) requestAnimationFrame(tick); };
      if (nums.length) requestAnimationFrame(tick);
    }
  }
}
