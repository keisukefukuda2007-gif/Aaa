/* ---------------- 飛び込み相談 ---------------- */
const Rare = Game.Rare = {
  available(){
    return Object.values(Game.rares).filter(r => !Game.state.zukan.rare[r.id] && Game.chapterOpen(chapterOf(r.chapter)) && (!r.after || Game.state.lessons[r.after]?.done));
  },
  check(){
    const s = Game.state, t = today();
    if (!s.player.name || s.rare.day === t) return;
    const pool = Rare.available();
    const lastCombo = s.stats.lastCombo || 0;
    const chance = .35 + Math.min(lastCombo, 8) * .05;
    const hit = pool.length && Object.keys(s.lessons).length > 0 && Math.random() < chance;
    s.rare = {day: t, id: hit ? pool[Math.floor(Math.random() * pool.length)].id : null, done: false};
    save();
  },
  current(){ const s = Game.state.rare; return s && s.day === today() && s.id && !s.done ? Game.rares[s.id] : null; },
};

/* ---------------- レッスンの実行 ---------------- */
function startLesson(l){ if (l.kind === 'exam') return startExam(l); new Run(l.kind === 'boss' ? 'boss' : 'lesson', l).start(); }
// 総合テスト：課題ごとに最低1問を含めて n 問を選ぶ（毎回選び直す）
function startExam(l){
  const r = U.rng(U.seed()), n = l.n || 15, pool = (l.pool || []).filter(id => Game.Q[id]);
  const bySkill = {};
  r.shuffle(pool).forEach(id => { const k = Game.Q[id].skill || '-'; (bySkill[k] = bySkill[k] || []).push(id); });
  const pick = Object.values(bySkill).map(a => a[0]);
  const rest = r.shuffle(pool.filter(id => !pick.includes(id)));
  const ids = r.shuffle(pick.concat(rest).slice(0, n));
  const steps = [{s: (l.cast || [])[1] || 'luka', t: l.intro || '章のまとめの試験です。ヒントはなし。間違えた問題は明日の復習に回ります。'}].concat(ids.map(id => ({q: id})));
  new Run('exam', Object.assign(Object.create(l), {steps})).start();
}
function startReview(){
  const due = SRS.due(10);
  if (!due.length) return;
  const steps = [{s: 'sendo', t: due.some(d => d.r.belief) ? '復習の時間だ。今日は「思い込み」で間違えた問題から行こう。数字は前回と変えてあるよ。' : '復習の時間だ。前に解いた問題が、数字を変えて戻ってきた。'}].concat(due.map(d => ({q: d.id})));
  new Run('review', {id: 'review', title: '今日の復習', scene: 'cafe', cast: ['me', 'sendo'], steps, panel: ['bs', 'pl', 'cf']}).start();
}
function startRare(r){
  const steps = [{s: r.who, t: r.intro}, {q: r.q}];
  new Run('rare', {id: r.id, title: '飛び込み相談', scene: 'street', cast: ['me', r.who], steps, rare: r, panel: ['bs', 'pl', 'cf']}).start();
}
Game.startLesson = startLesson; Game.startReview = startReview;

const TYPE_GUIDE = {
  choice: '正しいものを1つ選ぼう。', number: '数字キーで答えを入れよう。', estimate: 'スライダーで予想しよう。近ければ的中だ。',
  order: '正しい順に並べよう。', sort: 'それぞれ、どちらに当てはまる？', fill: '表の空欄を埋めよう。',
  judge: '結論と、その根拠をそれぞれ選ぼう。', arrows: 'この取引のあと、それぞれの数字はどう動く？',
};
const mythIdsOf = m => {
  const ids = new Set();
  (m.opts || []).forEach(o => o.myth && ids.add(o.myth));
  (m.traps || []).forEach(t => t.myth && ids.add(t.myth));
  (m.items || []).forEach(x => x && x.myth && ids.add(x.myth));
  (m.reasons || []).forEach(x => x.myth && ids.add(x.myth));
  (m.concl || []).forEach(x => x.myth && ids.add(x.myth));
  if (m.q.myth) ids.add(m.q.myth);
  (m.q.traps || []).forEach(t => t.myth && ids.add(t.myth));
  return [...ids].filter(id => Game.myths[id]);
};

class Run {
  constructor(kind, L){
    this.kind = kind; this.L = L; this.steps = L.steps.map(x => Object.assign({}, x)); this.i = -1;
    this.maxHp = kind === 'boss' ? (L.hp || 4) : kind === 'lesson' ? (L.hp || 5) : 0; this.hp = this.maxHp;
    this.combo = 0; this.maxCombo = 0; this.requeue = []; this.events = []; this.firstN = 0; this.firstOk = 0; this.answered = 0;
    this.total = this.steps.filter(x => x.q).length; this.terms = []; this.wrongIds = new Set();
    // 同じ挑戦の中で共有する数字（大型案件の計画など）。runSeed:true の問題と、関数の台詞が使う
    this.seed = U.seed(); this.ctx = L.ctx ? L.ctx(U.rng(this.seed)) : {}; this.groupSeeds = {};
  }
  start(){
    Game.currentRun = this;
    UI.show('play_shell');
    this.root = app();

/* ---------- 図：月ごとの利益の累計と現金（黒字倒産） ---------- */
Game.diagram('cashline', d => {
  const ms = d.months, n = ms.length, vals = ms.flatMap(x => [x.cash, x.cum]);
  const hi = Math.max(1, ...vals), lo = Math.min(0, ...vals), top = 6, h = 44;
  const y = v => top + (hi - v) / (hi - lo) * h, y0 = y(0), cw = 94 / n, x0 = 5;
  const bar = (x, w, v, col) => { const a = y(Math.max(v, 0)), b = y(Math.min(v, 0)); return `<rect x="${x.toFixed(1)}" y="${a.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(.6, b - a).toFixed(1)}" style="fill:${col}"/>`; };
  const lab = (x, v, col) => `<text x="${x.toFixed(1)}" y="${(v >= 0 ? y(v) - 1.2 : y(v) + 3.4).toFixed(1)}" text-anchor="middle" style="fill:${col};font-size:2.9px">${f(v)}</text>`;
  let g = '';
  ms.forEach((m, i) => {
    const bx = x0 + i * cw, cc = m.cash < 0 ? 'var(--dn)' : 'var(--teal)';
    g += bar(bx + cw * .1, cw * .38, m.cum, 'var(--up)') + lab(bx + cw * .29, m.cum, 'var(--up)');
    g += bar(bx + cw * .52, cw * .38, m.cash, cc) + lab(bx + cw * .71, m.cash, cc);
    g += `<text x="${(bx + cw / 2).toFixed(1)}" y="61" text-anchor="middle" style="fill:var(--ink);font-size:3px">${m.m}か月目</text>`;
  });
  return `<svg viewBox="0 0 100 64" style="width:100%;height:auto;display:block" role="img" aria-label="月ごとの利益の累計と月末の現金"><line x1="3" x2="99" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" style="stroke:var(--ink);stroke-width:.4"/>${g}</svg>
    <p class="dg-note"><span style="color:var(--up)">■</span> 利益の累計　<span style="color:var(--teal)">■</span> 月末の現金（<span style="color:var(--dn)">■</span> マイナス）　単位：万円</p>${d.note ? `<p class="dg-note">${U.rich(d.note)}</p>` : ''}`;
});

/* ---------- 数字を作る道具（第2章後半） ---------- */
// 黒字倒産の再現：売上は毎月 g ずつ伸び、代金は2か月後に入金。原価と固定費はその月に現金払い
const kurojiMonths = p => {
  let cash = p.C0, cum = 0; const out = [];
  for (let k = 1; k <= 6; k++) {
    const s = p.s1 + p.g * (k - 1), cost = s * p.c / 100, inc = k > 2 ? p.s1 + p.g * (k - 3) : 0, pay = cost + p.F, profit = s - cost - p.F;
    cash += inc - pay; cum += profit; out.push({m: k, s, cost, inc, pay, profit, cum, cash});
  }
  return out;
};
const kuroji = r => r.find(() => ({s1: r.pick([80, 100, 120, 150]), g: r.pick([40, 50, 60, 70]), c: r.pick([50, 60]), F: r.pick([20, 30, 40]), C0: r.pick([150, 180, 200, 220, 250, 280, 300])}), p => {
  const m = kurojiMonths(p), last = m[5];
  // 毎月黒字・2か月目までは現金が残る・6か月目はマイナス（予想の目盛り10に乗る）・現金＝最初の現金＋利益の累計−売掛金
  return m.every(x => x.profit > 0 && U.isInt(x.cost)) && m[1].cash > 0 && last.cash < 0 && last.cash % 10 === 0 && last.cash >= -400
    && last.cash === p.C0 + last.cum - (m[4].s + last.s);
}, 2000);

// 間接法の題材：取引を会計エンジンに通し、利益と営業CFのずれを作る（mixed:true で減少も混ぜる）
const indirectOpen = p => ({'現金': p.C0, '売掛金': p.AR0, '商品': p.I0, '設備': p.F0, '買掛金': p.AP0, '資本金': p.C0 + p.AR0 + p.I0 + p.F0 - p.AP0});
const indirectTxns = p => { const P = p.CG + p.dInv; return [Txn.buyStockCredit(P), Txn.sellCredit(p.S, p.CG), Txn.collectAR(p.S - p.dAR), Txn.payAP(P - p.dAP), Txn.salary(p.SAL), Txn.depreciate(p.D)]; };
const indirectOf = p => { const L = new Game.Ledger(indirectOpen(p)).post(indirectTxns(p)); return {L, NI: L.pl().ni, OP: L.cfs().op}; };
const indirectCase = (r, mixed) => r.find(() => {
  const S = r.pick([800, 1000, 1200, 1500]), c = r.pick([50, 60]);
  return {S, CG: S * c / 100, SAL: r.pick([150, 200, 250]), D: r.pick([40, 50, 60, 80]),
    dAR: mixed ? r.pick([-40, -20, 30, 50, 80]) : r.pick([30, 50, 80, 100]), dInv: mixed ? r.pick([-30, -20, 20, 40]) : r.pick([20, 30, 40, 60]), dAP: mixed ? r.pick([-20, 10, 20, 30]) : r.pick([10, 20, 30]),
    C0: r.pick([300, 400]), AR0: r.pick([100, 150, 200]), I0: r.pick([80, 100, 120]), AP0: r.pick([60, 80, 100]), F0: r.pick([400, 500])};
}, p => {
  if (!(p.S - p.CG - p.SAL - p.D > 0 && p.AR0 + p.dAR > 0 && p.I0 + p.dInv > 0 && p.AP0 + p.dAP > 0)) return false;
  const {L, NI, OP} = indirectOf(p);
  // 間接法の式と、会計エンジン（直接法）の営業CFが一致することを確かめる
  return OP === NI + p.D - p.dAR - p.dInv + p.dAP && L.check().length === 0 && L.b('売掛金') === p.AR0 + p.dAR && L.b('商品') === p.I0 + p.dInv && L.b('買掛金') === p.AP0 + p.dAP;
});

// 大型案件「大口受注の1年」：期首のBSと1年分の取引を会計エンジンに通して、全問題の数字を作る
const bossOpen = p => ({'現金': p.C0, '売掛金': p.AR0, '商品': p.I0, '設備': p.F0, '買掛金': p.AP0, '借入金': p.D0, '資本金': p.K, '利益剰余金': p.RE0});
const bossEnd = p => ({'現金': p.C1, '売掛金': p.AR0 + p.dAR, '商品': p.I0 + p.dInv, '設備': p.F0 + p.E - p.DEP, '買掛金': p.AP0 + p.dAP, '借入金': p.D0 + p.B - p.R, '資本金': p.K, '利益剰余金': p.RE0 + p.NI});
const bossYear = p => {
  const RE0 = p.C0 + p.AR0 + p.I0 + p.F0 - p.AP0 - p.D0 - p.K;
  const S = p.S0 + 12 * p.h, CG = S * p.c / 100, dAR = 2 * p.h, dInv = p.h * p.c / 100, dAP = p.h * p.c / 200;
  const P = CG + dInv, DEP = p.d0 + p.E / p.n, I = (p.D0 + p.B) * p.rate / 100;
  const pre = S - CG - p.SAL - p.RENT - DEP - I, T = pre * 30 / 100;
  const ints = [RE0, CG, dInv, dAP, DEP, I, T].every(U.isInt);
  if (!ints || RE0 < 50 || pre <= 0) return {ok: false};
  const q = Object.assign({}, p, {RE0});
  const L = new Game.Ledger(bossOpen(q)).post([Txn.borrow(p.B), Txn.buyEquip(p.E), Txn.buyStockCredit(P), Txn.sellCredit(S, CG), Txn.collectAR(S - dAR), Txn.payAP(P - dAP),
    Txn.salary(p.SAL), Txn.rent(p.RENT), Txn.depreciate(DEP), Txn.interest(I), Txn.tax(T), Txn.repay(p.R)]);
  const pl = L.pl(), cf = L.cfs(), NI = pl.ni, OP = cf.op, C1 = L.b('現金');
  const ok = p.I0 >= p.h * p.c / 100 && NI > 0 && C1 > 0 && OP > 0 && OP === NI + DEP - dAR - dInv + dAP && L.check().length === 0 && p.V * 2 <= NI && C1 > p.V
    && L.b('売掛金') === p.AR0 + dAR && L.b('設備') === p.F0 + p.E - DEP;
  return {ok, RE0, S, CG, dAR, dInv, dAP, DEP, I, T, NI, OP, C1, gross: pl.gross, opInc: pl.op, ord: pl.ord};
};
const bossPlan = r => r.find(() => {
  const p = {h: r.pick([100, 120, 150, 200]), c: r.pick([50, 60]), S0: r.pick([1500, 1800, 2000]), E: r.pick([600, 800, 1000]), n: r.pick([5, 8, 10]), d0: r.pick([50, 60, 80]),
    B: r.pick([600, 800, 1000]), rate: r.pick([2, 3]), R: r.pick([100, 150, 200]), SAL: r.pick([400, 500, 600]), RENT: r.pick([120, 180, 240]), V: r.pick([30, 50, 80]),
    C0: r.pick([200, 300, 400]), AR0: r.pick([100, 150]), I0: r.pick([80, 100, 120, 150]), F0: r.pick([500, 600]), AP0: r.pick([60, 80, 100]), D0: r.pick([300, 400]), K: r.pick([400, 500])};
  return Object.assign(p, bossYear(p));
}, p => p.ok, 3000);

    p.rect(88, 117, 3, 3, '#f6f0e2'); p.px(91, 118, '#f6f0e2'); p.hl(88, 90, 117, '#6b4129');
    // 観葉植物
    const fr = U.rng(333); p.vl(250, 116, 126, '#6a5040'); for (const [cx, cy, rr] of [[250, 115, 3], [247, 119, 2], [253, 118, 2]]) p.clump(cx, cy, rr, ['#2f5e3a', '#3f7d45', '#5b9e52', '#8cc46a'], fr);
    p.rect(247, 126, 7, 6, '#e8e2d2'); p.rect(252, 127, 2, 5, '#d0c8b6');
    // 床（タイルカーペット）
    p.rect(0, 131, W, 13, '#5a6478'); for (let x = 0; x < W; x += 12) p.vl(x, 131, 143, '#525c6e'); for (let y = 136; y < H; y += 5) p.hl(0, W - 1, y, '#525c6e');
    p.alpha(0, 131, W, 2, '#1d1630', .3); p.ellA(128, 139, 44, 4, '#ffe7b0', .07);
  },
  anim(p, W, H, t){
    const wx = 80, wy = 58, ww = 96;
    // 高架を走る電車（窓の中だけ）
    p.g.save(); p.g.beginPath(); p.g.rect(wx, wy, ww, 38); p.g.clip();
    const tx = ((t / 30) % (ww + 120)) - 60 + wx;
    for (let k = 0; k < 3; k++) { const cx = tx + k * 17; p.rect(cx, wy + 21, 16, 6, '#e8ecee'); p.rect(cx, wy + 24, 16, 1, '#2f6f73'); for (let i = 0; i < 3; i++) p.rect(cx + 2 + i * 5, wy + 22, 3, 1, '#ffd98e'); }
    p.g.restore();
    // 電光掲示：点の列が流れる
    p.g.save(); p.g.beginPath(); p.g.rect(wx, 48, ww, 5); p.g.clip();
    const off = Math.floor(t / 80) % 10;
    for (let x = wx - off; x < wx + ww; x += 10) { const up = ((x + off) / 10) % 3 !== 0; p.rect(x + 1, 50, 5, 1, up ? '#6fd08a' : '#f2a65a'); p.px(x + 7, up ? 49 : 51, up ? '#6fd08a' : '#f2a65a'); }
    p.g.restore();
    // マグの湯気
    for (let i = 0; i < 2; i++) { const ph = ((t / 1500) + i / 2) % 1; p.alpha(89 + Math.sin(ph * 7 + i), 115 - ph * 8, 1, 2, '#ffffff', .45 * (1 - ph)); }
  },
});

})();

</script>

<script id="boot">
/* 起動（章のscriptをすべて読み込んだあとに実行） */
(function(){
  const start = data => {
    Game.boot();
    if (data && data.screen === 'hub' && Game.state.player.name) Game.UI.show('hub');
  };
  try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => ({screen: Game.UI.cur === 'title' ? 'title' : 'hub'})); } catch (e) {}
  if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
